# ci-harness self-smoke fixture — CURRENT adoption pin (must pass today).
#
# Declares `update: automatic`, the policy play-nice-contracts uses for its
# own adoption: while the pin is a provable ancestor of the library's main
# and contracts/ and schema/ are byte-identical to it, the gate reads
# CURRENT (the equivalence rule). Docs-only library moves therefore leave
# this green. When a contract or schema file changes upstream, `contract
# freshness — current pin` goes red until this file is re-pinned: still a
# human decision; the Play-Nice pin robot (play-nice-contracts
# tools/pin-sync) follows it like any adopter and opens the one-line PR.
# Before 2026-10-08 every library move turned ci-harness
# main red (eight re-pins in two weeks, most for docs). The parallel
# contract-freshness-live job generates its pin at run time and never
# rots; together the two prove the green verdict tracks the remote rather
# than a hardcoded constant.
schema: play-nice/adoption-v1
project: ci-harness-fixture-current
source:
  repository: rylee-bee-labs/play-nice-contracts
  revision: 2969685e38458a65e29bc8f63f3b38a3ab4a4556   # re-pinned 2026-10-11 by the coordinator to clear the red main that play-nice-contracts#67 caused (schema/library.schema.json $id owner string); no contract rule changed.
freshness:
  policy: require-current
  ref: main
  update: automatic

always:
  - assume-unknown
