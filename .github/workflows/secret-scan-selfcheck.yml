name: secret-scan-selfcheck

# ci-harness scans its own repository for secrets, using its own reusable
# workflow — proves the template works before any consumer adopts it.
#
# pull_request: only the PR's own commits are scanned (the template decides).
# push to main and the weekly schedule: full history. Never drop those two.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  scan-self:
    uses: ./.github/workflows/reusable-secret-scan.yml
    with:
      fetch-depth: 0
