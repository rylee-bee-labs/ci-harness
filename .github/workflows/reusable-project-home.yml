name: reusable-project-home

# ci-harness — narrow Project Home orchestration reporter.
#
# This workflow does not run or approve work. It only calls Project Home's
# dedicated CI boundary so a caller can claim one known task, heartbeat its
# lease, finish that owned task, or queue a safe BOOP notice.
#
# Real callers provide both secrets. The self-smoke escape hatch is accepted
# only when the caller repository itself is rylee-bee-labs/ci-harness; it validates
# request construction without touching the network.
#
# Telemetry: this job carries a `cicd.pipeline.task.*` span and hands Project
# Home a W3C `traceparent` on its /api/ci call, which is the whole point of the
# reporter being instrumented (homelab docs/observability/TELEMETRY-CONTRACT.md
# §2 and §6). When that trace context also knows the mission and task ids, the
# claim, heartbeat and finish calls carry them in the `Estate-Task` request
# header — the header Project Home already reads — so its own ci.task.* spans
# are joinable after the trace is gone: a mission runs for days and no single
# trace spans it. The request bodies are untouched; a CI consumer that knows
# nothing about telemetry must see a body it recognises. It does NOT
# check out the repository — a reporter must stay cheap, and cloning the caller
# to read one commit trailer would put telemetry ahead of the work it observes.
# The trailer is read the other way instead: one API read of the head commit's
# message, with the job token, in the context step below. That read can fail, or
# find nothing, and then this run's own trace is used and linked back by
# vcs.change.id — the same honest fallback every other template has, never an
# invented id. OpenTelemetry
# observes the estate; it never becomes the estate: a span cannot fail the call.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >-
          Timeout for every job in this workflow, in minutes. A hung job otherwise holds a
          runner for GitHub's 360-minute default.
        type: number
        required: false
        default: 30
      runs-on:
        description: Runner label for the reporter job.
        type: string
        required: false
        default: ubuntu-latest
      action:
        description: One of claim, heartbeat, finish, notice.
        type: string
        required: true
      task-id:
        description: Project Home task id for claim/heartbeat/finish.
        type: string
        required: false
        default: ""
      actor:
        description: Stable lease owner. Empty derives gha:<repo>:<run_id>.
        type: string
        required: false
        default: ""
      lease-seconds:
        description: Lease duration for claim/heartbeat (Project Home caps at 3600).
        type: number
        required: false
        default: 900
      outcome:
        description: "Finish outcome: succeeded, failed, review, or retry."
        type: string
        required: false
        default: succeeded
      note:
        description: Short safe summary attached to finish.
        type: string
        required: false
        default: ""
      notice-key:
        description: Deduplication key for notice.
        type: string
        required: false
        default: ""
      notice-category:
        description: completion, interrupted, blocker, deployment, or mission.
        type: string
        required: false
        default: mission
      notice-title:
        description: Safe notification title.
        type: string
        required: false
        default: ""
      notice-body:
        description: Safe notification body.
        type: string
        required: false
        default: ""
      notice-link:
        description: Relative Project Home deep link, beginning with /.
        type: string
        required: false
        default: ""
      self-smoke:
        description: Internal ci-harness contract test only; forbidden to other callers.
        type: boolean
        required: false
        default: false
    secrets:
      project-home-url:
        description: Project Home base URL. Required unless internal self-smoke is true.
        required: false
      project-home-token:
        description: Project Home bearer token carrying only the ci scope.
        required: false

permissions:
  contents: read

jobs:
  report:
    name: Project Home ${{ inputs.action }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin/conftest bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      # Telemetry is observation, never authority: this step cannot fail the job,
      # and the helper exits 0 even when the Collector is unreachable. The
      # endpoint arrives through the standard OTEL environment variables read
      # from repository variables — an unset variable is simply empty, which
      # means off. No `workflow_call` input is added for it: that would cost a
      # self-smoke job per template for one string, and would be the
      # estate-specific discovery the contract rules out.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/0169f7367fe00aa525fe398aa87b040210b22e86/scripts/otel-span.sh
          OTELSPAN_HELPER_SHA256: c28910154fb3a6b9b7aaf79a65b863acee7fd7b7fa905a1c0f2b4ffb375e81e8
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-project-home:report
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
          # The job token, for the one API read below. It is passed as an
          # environment variable and never as an argument, so it never reaches
          # argv — on a self-hosted runner any process of the same user can read
          # another's command line while it runs. contents:read is all this needs,
          # and that is the default token permission.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # No checkout in this job (see the header), so there is no HEAD commit
          # to read an Estate-Task trailer from and no caller tree to read the
          # helper from: the helper comes from ci-harness itself, and the trailer
          # comes from the API — one read of one commit message, with the job
          # token. That is what lets this job send the Estate-Task header at all:
          # without it the reporter would be the one job on the trace that could
          # never be correlated. It is a read of a commit message, NOT a
          # checkout: a reporter must stay cheap, and cloning the caller to read
          # one trailer would put telemetry ahead of the work it observes.
          if curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER" \
            && echo "$OTELSPAN_HELPER_SHA256  $OTELSPAN_HELPER" | sha256sum -c -; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          else
            echo "::notice::otel: span helper unavailable or failed its sha256 check; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi

      - name: Build and send bounded Project Home request
        shell: bash
        env:
          PH_ACTION: ${{ inputs.action }}
          PH_TASK_ID: ${{ inputs.task-id }}
          PH_ACTOR_INPUT: ${{ inputs.actor }}
          PH_LEASE_SECONDS: ${{ inputs.lease-seconds }}
          PH_OUTCOME: ${{ inputs.outcome }}
          PH_NOTE: ${{ inputs.note }}
          PH_NOTICE_KEY: ${{ inputs.notice-key }}
          PH_NOTICE_CATEGORY: ${{ inputs.notice-category }}
          PH_NOTICE_TITLE: ${{ inputs.notice-title }}
          PH_NOTICE_BODY: ${{ inputs.notice-body }}
          PH_NOTICE_LINK: ${{ inputs.notice-link }}
          PH_SELF_SMOKE: ${{ inputs.self-smoke && '1' || '0' }}
          PH_URL: ${{ secrets.project-home-url }}
          PH_TOKEN: ${{ secrets.project-home-token }}
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
        run: |
          set -euo pipefail

          # One trace context, computed once for the whole step: the same span id
          # is what goes out as `traceparent` and what the job span is recorded
          # under, so Project Home's own spans land in this run's trace. Four
          # separate steps would have meant four contexts and four chances to
          # disagree with each other.
          otel_traceparent=""
          otel_job_span=""
          if [ -s "${OTELSPAN_HELPER:-}" ] && [ -s "${OTELSPAN_ENV_FILE:-}" ]; then
            otel_traceparent=$(sed -n "s/^otel_traceparent='\(.*\)'\$/\1/p" "$OTELSPAN_ENV_FILE")
            otel_job_span=$(sed -n "s/^otel_span_id='\(.*\)'\$/\1/p" "$OTELSPAN_ENV_FILE")
          fi

          # Every span emission is guarded and cannot fail this step: GitHub
          # checks remain GitHub checks, and OTLP failure must never fail CI.
          #
          # The `github-hosted` guard is the helper's own `ci-emit` guard, in the
          # same form and reading the same field: a GitHub-hosted runner cannot
          # reach the LAN Collector, so this step stays quiet and says so in the
          # step summary rather than spending a two-second dial on a span that
          # cannot arrive. Missing telemetry is UNKNOWN, not a failure.
          otel() { # $1 role, $2 result; remaining args are forwarded to ci-emit
            [ -s "${OTELSPAN_HELPER:-}" ] || return 0
            otel_host_class=""
            if [ -s "${OTELSPAN_ENV_FILE:-}" ]; then
              otel_host_class=$(sed -n "s/^otel_host_class='\(.*\)'\$/\1/p" "$OTELSPAN_ENV_FILE" || true)
            fi
            if [ "${otel_host_class:-unknown}" = "github-hosted" ]; then
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '### OpenTelemetry\n\nHost class is github-hosted; the LAN Collector is unreachable from this runner, so no span was emitted. Missing telemetry is UNKNOWN, not a failure.\n' >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              fi
              echo "otel: host-class github-hosted — Collector unreachable from this runner, span not emitted"
              return 0
            fi
            bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" \
              --role "$1" --result "$2" "${@:3}" >/dev/null 2>&1 || true
          }

          case "$PH_ACTION" in
            claim|heartbeat|finish|notice) ;;
            *)
              echo "::error::action must be claim, heartbeat, finish, or notice"
              otel pipeline failure
              otel job failure
              exit 2
              ;;
          esac

          actor="$PH_ACTOR_INPUT"
          if [ -z "$actor" ]; then
            actor="gha:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}"
          fi

          case "$PH_ACTION" in
            claim|heartbeat|finish)
              if ! [[ "$PH_TASK_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::task-id must be a numeric Project Home task id"
                otel pipeline failure
                otel job failure
                exit 2
              fi
              ;;
          esac

          if [ "$PH_ACTION" = "finish" ]; then
            case "$PH_OUTCOME" in
              succeeded|failed|review|retry) ;;
              *)
                echo "::error::outcome must be succeeded, failed, review, or retry"
                otel pipeline failure
                otel job failure
                exit 2
                ;;
            esac
          fi

          if [ "$PH_ACTION" = "notice" ]; then
            case "$PH_NOTICE_CATEGORY" in
              completion|interrupted|blocker|deployment|mission) ;;
              *)
                echo "::error::notice-category is not allowed"
                otel pipeline failure
                otel job failure
                exit 2
                ;;
            esac
            if [ -z "$PH_NOTICE_KEY" ] || [ -z "$PH_NOTICE_TITLE" ]; then
              echo "::error::notice requires notice-key and notice-title"
              otel pipeline failure
              otel job failure
              exit 2
            fi
          fi

          export PH_ACTOR="$actor"
          export PH_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # The correlation ids ride one interface: the `Estate-Task` request
          # header Project Home already accepts (its telemetry.py correlation()
          # falls back to it when a body carries no id pair). Not a body field —
          # the body below is exactly the CI body it has always been, because a
          # consumer that knows nothing about telemetry must see a shape it
          # recognises.
          #
          # The value comes from the same helper and the same env-file the
          # traceparent above came from, so the ids on the wire are the ids this
          # run's spans are recorded under. With no trailer the value is empty
          # and no header is sent at all: a missing id is honest, an invented one
          # would join this run to a task it is not working on. A notice belongs
          # to no task, so it never carries the header even on a mission's HEAD.
          ph_estate_task=""
          if [ "$PH_ACTION" != "notice" ] && [ -s "${OTELSPAN_HELPER:-}" ] && [ -s "${OTELSPAN_ENV_FILE:-}" ]; then
            ph_estate_task=$(bash "$OTELSPAN_HELPER" project-home-header --env-file "$OTELSPAN_ENV_FILE" 2>/dev/null || true)
          fi
          printf '%s' "$ph_estate_task" > "$RUNNER_TEMP/project-home-estate-task"

          python3 - <<'PY' > "$RUNNER_TEMP/project-home-request.json"
          import json
          import os

          action = os.environ["PH_ACTION"]
          if action in {"claim", "heartbeat"}:
              payload = {
                  "actor": os.environ["PH_ACTOR"],
                  "lease_seconds": int(os.environ["PH_LEASE_SECONDS"]),
              }
          elif action == "finish":
              payload = {
                  "actor": os.environ["PH_ACTOR"],
                  "outcome": os.environ["PH_OUTCOME"],
                  "note": os.environ["PH_NOTE"],
                  "run_url": os.environ["PH_RUN_URL"],
              }
          else:
              payload = {
                  "key": os.environ["PH_NOTICE_KEY"],
                  "category": os.environ["PH_NOTICE_CATEGORY"],
                  "title": os.environ["PH_NOTICE_TITLE"],
                  "body": os.environ["PH_NOTICE_BODY"],
                  "link": os.environ["PH_NOTICE_LINK"],
              }
          print(json.dumps(payload, separators=(",", ":")))
          PY

          if [ "$PH_SELF_SMOKE" = "1" ]; then
            if [ "$GITHUB_REPOSITORY" != "rylee-bee-labs/ci-harness" ]; then
              echo "::error::self-smoke is reserved for ci-harness"
              otel pipeline failure
              otel job failure
              exit 2
            fi
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "project-home-request.json").read_text())
          if os.environ["PH_ACTION"] == "notice":
              assert payload["key"] == os.environ["PH_NOTICE_KEY"]
              assert payload["title"] == os.environ["PH_NOTICE_TITLE"]
          # One interface: the ids ride the Estate-Task header, never the body.
          assert "mission_id" not in payload and "mission_task_id" not in payload, payload
          header = Path(os.environ["RUNNER_TEMP"], "project-home-estate-task").read_text()
          ctx = Path(os.environ["RUNNER_TEMP"], "otel-ctx.env")
          found = {}
          if ctx.is_file():
              found = dict(
                  line.split("=", 1)
                  for line in ctx.read_text().splitlines()
                  if line.startswith(("otel_mission_id=", "otel_task_id="))
              )
          mission = found.get("otel_mission_id", "''").strip("'")
          task = found.get("otel_task_id", "''").strip("'")
          if os.environ["PH_ACTION"] == "notice" or not (mission and task):
              assert header == "", header
          else:
              assert header == mission + "/" + task, header
          print("Project Home reporter self-smoke: request construction OK")
          PY
            otel pipeline success
            otel job success
            exit 0
          fi

          if [ -z "$PH_URL" ] || [ -z "$PH_TOKEN" ]; then
            echo "::error::project-home-url and project-home-token secrets are required"
            otel pipeline failure
            otel job failure
            exit 2
          fi

          base="${PH_URL%/}"
          case "$PH_ACTION" in
            claim) endpoint="$base/api/ci/tasks/$PH_TASK_ID/claim"; route="/api/ci/tasks/{task_id}/claim" ;;
            heartbeat) endpoint="$base/api/ci/tasks/$PH_TASK_ID/heartbeat"; route="/api/ci/tasks/{task_id}/heartbeat" ;;
            finish) endpoint="$base/api/ci/tasks/$PH_TASK_ID/finish"; route="/api/ci/tasks/{task_id}/finish" ;;
            notice) endpoint="$base/api/ci/notice"; route="/api/ci/notice" ;;
          esac

          response="$RUNNER_TEMP/project-home-response.json"
          set +e
          # The token reaches curl on stdin (--config -), never in argv: on a self-hosted runner any
          # process of the same user can read another's command line while it runs. The traceparent
          # and the Estate-Task ids ride the same way. Only the route and the method are ever
          # recorded; the host, the task id and the request body stay out of the span.
          code=$({
            printf 'header = "Authorization: Bearer %s"\n' "$PH_TOKEN"
            if [ -n "$otel_traceparent" ]; then
              printf 'header = "traceparent: %s"\n' "$otel_traceparent"
            fi
            if [ -n "$ph_estate_task" ]; then
              printf 'header = "Estate-Task: %s"\n' "$ph_estate_task"
            fi
          } | curl --config - \
            --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/project-home-request.json" \
            "$endpoint")
          curl_rc=$?
          set -e

          if [ "$curl_rc" -ne 0 ]; then
            echo "::error::Project Home request failed at the transport layer"
            otel pipeline failure
            otel job failure
            exit "$curl_rc"
          fi
          case "$code" in
            2??)
              echo "Project Home accepted CI action '$PH_ACTION' (HTTP $code)"
              otel job success --child --name project_home.ci_request --parent-span-id "$otel_job_span" \
                --attr "http.request.method=POST" --attr "http.route=$route" \
                --attr "url.path=$route" --attr "http.response.status_code=$code"
              otel pipeline success
              otel job success
              ;;
            *)
              echo "::error::Project Home rejected CI action '$PH_ACTION' (HTTP $code)"
              otel job failure --child --name project_home.ci_request --parent-span-id "$otel_job_span" \
                --attr "http.request.method=POST" --attr "http.route=$route" \
                --attr "url.path=$route" --attr "http.response.status_code=$code"
              otel pipeline failure
              otel job failure
              exit 1
              ;;
          esac
