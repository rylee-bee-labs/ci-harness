name: reusable-contract-freshness

# ci-harness — Play-Nice contract freshness gate (workflow_call).
#
# Harness-owned mechanics: blobless-clone the authoritative contract source
# (rylee-bee-labs/play-nice-contracts) over https, run its stdlib-only
# `contractctl freshness --manifest <caller manifest> --json`, and
# propagate the tool's exit code as the job's exit code. Repo-owned
# semantics: which manifest expresses the adoption pin
# (e.g. `.project/contracts/adoption.yaml`) and when the gate fires.
#
# Fail closed — proven, not asserted: the tool exits 0 ONLY on status
# CURRENT. BEHIND / DIVERGED exit 1; UNREACHABLE / UNKNOWN (including a
# missing or malformed manifest) exit 2. Anything red is red honestly.
#
# Why the clone is deliberately NOT pinned (see pins/ACTIONS.md): the
# cloned tool's own checkout revision is one of the pins `freshness`
# compares against the remote head. Pinning the clone to anything but the
# default-branch tip would force the verdict away from CURRENT forever.
# The revision under test is always the CONSUMER'S manifest pin, never
# this plumbing. The clone is blobless (`--filter=blob:none`): all commits
# and trees, file contents for the tip only, about the size of a `--depth 1`
# clone. Full history lets the tool PROVE fast-forward ancestry, so a pin
# that is merely behind reads BEHIND (a `--depth 1` clone could only say
# DIVERGED), and a manifest that declares `freshness.update: automatic` gets
# the tool's equivalence rule: an ancestor pin whose contracts/ and schema/
# are byte-identical to the remote reads CURRENT. A docs-only library move
# then stops turning consumers red; any contract change still reads BEHIND
# (exit 1). The pin itself never moves here.
#
# Honesty line: this template never syncs a pin. Pin movement belongs to
# the consumer: by hand, or by a pin robot that opens a reviewed pin PR
# (play-nice-contracts tools/pin-sync). `expect: warn` is for pull
# requests in a repo that has such a robot: drift is reported as a
# warning so unrelated PRs aren't blocked, while pushes to the default
# branch and the schedule keep `current` and stay honestly red after a
# three-day grace for BEHIND only. The clock starts at the oldest upstream
# commit after the pin; DIVERGED and uncomputable states remain red.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >-
          Timeout for every job in this workflow, in minutes. A hung job otherwise holds a
          runner for GitHub's 360-minute default.
        type: number
        required: false
        default: 30
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      manifest-path:
        description: >-
          Adoption-v1 manifest to verify, relative to the calling repo root,
          e.g. ".project/contracts/adoption.yaml".
        type: string
        required: true
      expect:
        description: >-
          Required verdict. DEFAULT "current" = consumer semantics: red on
          ANY drift (BEHIND/DIVERGED/UNREACHABLE/UNKNOWN all fail). The
          harness's self-smoke passes "noncurrent" against a permanently
          stale fixture: the job goes GREEN exactly when the gate correctly
          refuses the drifted pin — GitHub forbids continue-on-error on
          uses: jobs, so this inversion is an explicit, readable input,
          never a swallowed failure. "noncurrent" accepts exactly
          BEHIND/DIVERGED with nonzero exit; nothing else. "warn" (for
          pull requests in repos with a pin robot) passes with a visible
          warning on any non-CURRENT verdict; the `status` output still
          carries the real verdict.
        type: string
        required: false
        default: "current"
      grace-days:
        description: >-
          For expect=current only, delay failure for a BEHIND pin until this many days
          after the oldest unadopted upstream commit. Does not soften other verdicts.
        type: number
        required: false
        default: 3
    outputs:
      exit-code:
        description: >-
          Process exit code of `contractctl freshness` (0 = CURRENT;
          1 = BEHIND/DIVERGED; 2 = UNREACHABLE/UNKNOWN or tool error).
        value: ${{ jobs.freshness.outputs.exit-code }}
      status:
        description: >-
          Machine verdict: CURRENT | BEHIND | DIVERGED | UNREACHABLE | UNKNOWN.
        value: ${{ jobs.freshness.outputs.status }}
      within-grace:
        description: "true only when a BEHIND verdict passed inside the grace window"
        value: ${{ jobs.freshness.outputs.within-grace }}

permissions:
  contents: read

jobs:
  freshness:
    name: contract freshness
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      exit-code: ${{ steps.check.outputs.exit-code }}
      status: ${{ steps.check.outputs.status }}
      within-grace: ${{ steps.check.outputs.within-grace }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin/conftest bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/0169f7367fe00aa525fe398aa87b040210b22e86/scripts/otel-span.sh
          OTELSPAN_HELPER_SHA256: c28910154fb3a6b9b7aaf79a65b863acee7fd7b7fa905a1c0f2b4ffb375e81e8
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-contract-freshness:freshness
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER" \
            || ! echo "$OTELSPAN_HELPER_SHA256  $OTELSPAN_HELPER" | sha256sum -c -; then
            echo "::notice::otel: span helper unavailable or failed its sha256 check; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      - name: Blobless-clone contract source (https, no credentials)
        run: >-
          git clone --filter=blob:none
          https://github.com/rylee-bee-labs/play-nice-contracts.git
          "${{ runner.temp }}/play-nice-contracts"
      - name: Contract freshness gate (fail closed)
        id: check
        shell: bash
        env:
          # Inputs travel via env, never interpolated into the script text.
          MANIFEST: ${{ github.workspace }}/${{ inputs.manifest-path }}
          CONTRACTCTL: ${{ runner.temp }}/play-nice-contracts/tools/contractctl/contractctl.py
          JSON_OUT: ${{ runner.temp }}/freshness.json
          EXPECT: ${{ inputs.expect }}
          GRACE_DAYS: ${{ inputs.grace-days }}
          CONTRACT_REPO: ${{ runner.temp }}/play-nice-contracts
        run: |
          set +e
          python3 "$CONTRACTCTL" freshness --manifest "$MANIFEST" --json > "$JSON_OUT"
          rc=$?
          cat "$JSON_OUT"
          status=$(FRESHNESS_JSON="$JSON_OUT" python3 -c 'import json, os; print(json.load(open(os.environ["FRESHNESS_JSON"])).get("status", "UNKNOWN"))' 2>/dev/null) || status=UNKNOWN
          detail=$(FRESHNESS_JSON="$JSON_OUT" python3 -c 'import json, os; print(json.load(open(os.environ["FRESHNESS_JSON"])).get("detail", "")[:300])' 2>/dev/null) || detail=""
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "within-grace=false" >> "$GITHUB_OUTPUT"
          case "$EXPECT" in
            current)
              if [ "$rc" -ne 0 ]; then
                if [ "$status" = "BEHIND" ]; then
                  grace=$(python3 - "$MANIFEST" "$CONTRACT_REPO" "$GRACE_DAYS" <<'PY'
          import datetime as dt
          import json
          import re
          import subprocess
          import sys

          manifest, repo, grace_raw = sys.argv[1:]
          try:
              grace = float(grace_raw)
              if grace < 0 or not grace < float("inf"):
                  raise ValueError("invalid grace-days")
              lines = open(manifest, encoding="utf-8").read().splitlines()
              in_source = False
              pin = None
              for line in lines:
                  if re.fullmatch(r"source:\s*", line):
                      in_source = True
                      continue
                  if in_source and line and not line[0].isspace():
                      break
                  match = re.fullmatch(r"\s{2}revision:\s*([0-9a-f]{40})\s*(?:#.*)?", line)
                  if in_source and match:
                      pin = match.group(1)
                      break
              if pin is None:
                  raise ValueError("missing or malformed source.revision")
              def git(*args):
                  return subprocess.run(["git", "-C", repo, *args], check=True,
                                        capture_output=True, text=True).stdout.strip()
              pin = git("rev-parse", "--verify", f"{pin}^{{commit}}")
              head = git("rev-parse", "--verify", "refs/remotes/origin/main^{commit}")
              if subprocess.run(["git", "-C", repo, "merge-base", "--is-ancestor", pin, head]).returncode != 0:
                  raise ValueError("pin is not an ancestor of upstream main")
              commits = git("rev-list", "--reverse", "--ancestry-path", f"{pin}..{head}").splitlines()
              if not commits:
                  raise ValueError("BEHIND has no unadopted commits")
              oldest = commits[0]
              stamp = int(git("show", "-s", "--format=%ct", oldest))
              age = (dt.datetime.now(dt.timezone.utc).timestamp() - stamp) / 86400
              if age < 0:
                  raise ValueError("oldest upstream commit has a future timestamp")
              expires = dt.datetime.fromtimestamp(stamp + grace * 86400, dt.timezone.utc)
              print(json.dumps({"within": age < grace, "pin": pin, "head": head,
                                "grace": grace, "expires": expires.isoformat(), "age": age}))
          except Exception as exc:
              print(f"cannot compute BEHIND grace: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
                  ) || {
                    echo "::error::contract freshness grace could not be computed; failing closed"
                    exit "$rc"
                  }
                  within=$(GRACE_JSON="$grace" python3 -c 'import json,os; print(str(json.loads(os.environ["GRACE_JSON"])["within"]).lower())')
                  if [ "$within" = true ]; then
                    echo "within-grace=true" >> "$GITHUB_OUTPUT"
                    message=$(GRACE_JSON="$grace" python3 -c 'import json,os; d=json.loads(os.environ["GRACE_JSON"]); print("BEHIND pin %s…; upstream main %s…; grace %s days expires %s (oldest unadopted commit age %.2f days)" % (d["pin"][:12], d["head"][:12], d["grace"], d["expires"], d["age"]))')
                    echo "::warning::contract freshness: $message"
                    echo "### Contract freshness grace" >> "$GITHUB_STEP_SUMMARY"
                    echo "$message" >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                fi
                echo "::error::contract freshness gate failed: status=$status (exit $rc) — ${detail:-no verdict detail; check the JSON above} — read what changed upstream, then re-pin source.revision in the manifest manually (a human decision; this check detects drift and never moves pins)"
                exit "$rc"
              fi
              echo "CURRENT — verdict green"
              ;;
            noncurrent)
              if [ "$rc" -eq 0 ] || { [ "$status" != "BEHIND" ] && [ "$status" != "DIVERGED" ]; }; then
                echo "::error::self-smoke inversion expects BEHIND or DIVERGED with nonzero exit; got status=$status exit=$rc — the fail-closed gate went soft"
                exit 1
              fi
              echo "stale pin correctly refused (status=$status exit=$rc) — the red path is genuinely red"
              ;;
            warn)
              if [ "$rc" -ne 0 ]; then
                echo "::warning::Play-Nice moved (status=$status): this PR is not blocked; the pin robot opens a separate pin PR. ${detail}"
                echo "### Play-Nice moved ($status)" >> "$GITHUB_STEP_SUMMARY"
                echo "Not blocking this PR. The pin robot opens a separate pin PR; the default branch and the weekly check stay strict." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "CURRENT — verdict green"
              fi
              ;;
            *)
              echo "::error::unknown expect='$EXPECT' (valid: current | noncurrent | warn)"
              exit 2
              ;;
          esac

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true
