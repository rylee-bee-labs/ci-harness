name: reusable-python

# ci-harness — reusable Python pipeline (workflow_call).
#
# Harness-owned mechanics: checkout (pinned), setup-python, uv bootstrap,
# `uv sync --frozen`, and invocation of the repo-given pytest command.
# Repo-owned semantics: which extras to sync, which pytest arguments gate
# the build, and which extra repo gates run after the tests.
#
# Every action SHA below comes from pins/ACTIONS.md — the single pinning
# source. Consumers declare ~5 lines per job; see README.md.
#
# Telemetry: every job emits a pipeline span and a job span through
# scripts/otel-span.sh, using OpenTelemetry's CI/CD and VCS semantic
# conventions (homelab docs/observability/TELEMETRY-CONTRACT.md §3). OpenTelemetry
# observes the estate,
# it never becomes the estate — the pytest/ruff/bandit exit codes stay the gate,
# and every telemetry step is continue-on-error so an OTLP failure can never
# fail a job. Unset endpoint means the whole thing is off.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      python-version:
        description: CPython version for the test interpreter.
        type: string
        required: false
        default: "3.12"
      uv-version:
        description: Exact uv version bootstrapped via pip.
        type: string
        required: false
        default: "0.11.28"
      project-directory:
        description: Directory holding pyproject.toml and uv.lock.
        type: string
        required: false
        default: "."
      sync-args:
        description: >-
          Extra arguments for `uv sync --frozen`, e.g.
          "--extra test --extra crypto".
        type: string
        required: false
        default: ""
      pytest-args:
        description: >-
          Arguments for `uv run pytest` — the repo's real test invocation.
          Quote-bearing arguments (e.g. -k "A or B") keep their shell
          meaning: this text is expanded into the run command, exactly as
          if the repo had written the step itself.
        type: string
        required: false
        default: ""
      pytest-workers:
        description: >-
          Parallel pytest workers (pytest-xdist, installed into the synced
          environment for this run only, so no repo lockfile changes). 0 = serial, the
          default. A number pins the count. `auto` sizes it per job:
          max(1, min(cap_cores, 8) // max(1, busy_jobs)), where cap_cores is the cgroup CPU cap
          (/sys/fs/cgroup/cpu.max quota/period, nproc when it says "max" or is absent) and
          busy_jobs counts the pytest runs currently holding a lock file under
          runner.tool_cache/busy-jobs (this job included), so four overlapping jobs on a
          6-CPU cap get 1 worker each and a lone job gets 6. Hosted runners: nproc. Opt in per
          repo only after its suite has passed in parallel (2026-10-10: agent-platform
          633 s -> 173 s on 6 workers, all green). Type is string: callers pass "6" (quoted) or "auto", never a bare 6.
        type: string
        required: false
        default: "0"
      pytest-select:
        description: >-
          all (default) runs the whole suite. affected, on pull_request only, runs just the tests
          pytest-testmon says the PR touched, using testmon data recorded on the base branch
          (self-hosted: a runner-local dir under runner.tool_cache; hosted: actions/cache, saved on
          a push to the default branch and restored on the PR, see docs/CI-SPEED.md). Falls back to the FULL suite, and says why in
          the job summary, when there is no data (self-hosted: none for the PR's base commit;
          hosted: nothing restored, while an older base's data is used because stale data only
          selects more), the PR touches conftest.py, pyproject.toml, uv.lock, setup.cfg,
          pytest.ini, tox.ini or a .github/workflows file, the PR changes any file that is not a
          .py file under project-directory, or testmon selects zero tests. A push to the default
          branch always runs the full suite and refreshes the data. testmon runs are serial
          (pytest-testmon is installed for the run only); see docs/CI-SPEED.md.
        type: string
        required: false
        default: all
      timeout-minutes:
        description: >-
          Timeout for every job in this workflow (test, ruff, bandit), in minutes. A hung
          job otherwise holds a runner for GitHub's 360-minute default.
        type: number
        required: false
        default: 30
      junit-artifact-name:
        description: >-
          Name of the uploaded pytest junit-xml artifact. Artifact names must be unique per
          workflow run: override when calling this template more than once from one caller.
        type: string
        required: false
        default: pytest-junit
      post-test-commands:
        description: >-
          Shell lines to run in the synced environment after pytest passes,
          for repo-owned gates that are not pytest (validators, censuses).
          Executed under `set -euo pipefail`; first non-zero exit fails the job.
        type: string
        required: false
        default: ""
      enable-ruff:
        description: >-
          Add a separate ruff lint job. ruff must come from the repo's own
          uv.lock (the job runs `uv run ruff`).
        type: boolean
        required: false
        default: false
      ruff-args:
        description: Arguments for `uv run ruff`.
        type: string
        required: false
        default: "check ."
      enable-bandit:
        description: >-
          Add a separate bandit scan job. bandit must come from the repo's
          own uv.lock (the job runs `uv run bandit`).
        type: boolean
        required: false
        default: false
      bandit-args:
        description: Arguments for `uv run bandit`.
        type: string
        required: false
        default: "-q -r ."

permissions:
  contents: read

jobs:
  test:
    name: python tests
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.project-directory }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin/conftest bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2 keeps both parents of a pull_request merge commit, so the base tip is HEAD^1.
          fetch-depth: 2

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-python:test
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      # Self-hosted runners share one uv cache per runner host (uv's cache is safe for concurrent
      # use), so a job's `uv sync` is mostly hardlinks. Only the cache is shared: never .venv.
      # Hosted runners use setup-uv's cache instead (the step after Bootstrap uv).
      - name: Warm uv cache (self-hosted runner-local dir)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        env:
          CACHE_DIR: ${{ runner.tool_cache }}/uv-cache
        run: |
          if mkdir -p "$CACHE_DIR" && [ -w "$CACHE_DIR" ]; then
            echo "UV_CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
            echo "uv cache: $CACHE_DIR"
          else
            echo "::warning::uv cache dir $CACHE_DIR is not writable; using uv's default cache"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Bootstrap uv
        run: pip install uv==${{ inputs.uv-version }}
      # Hosted runners: restore and save uv's package cache through setup-uv (keyed on uv.lock).
      # Self-hosted runners use the runner-local UV_CACHE_DIR set above instead.
      - name: Warm uv cache (hosted, setup-uv)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Sync locked dependencies
        run: uv sync --frozen ${{ inputs.sync-args }}
      # Hosted testmon store (pytest-select=affected only): runners are throwaway, so the data goes
      # through actions/cache. A push to the default branch saves it under a key that ends in the
      # commit sha; a pull_request restores the exact key of its base sha, else the newest entry
      # with the same prefix. A stale entry is safe: testmon compares the current file fingerprints
      # with the stored ones, so older data can only select MORE tests, never fewer. Nothing
      # restored = the full suite. Self-hosted runners keep the runner-local store instead.
      - name: Testmon cache key (hosted)
        id: testmon-key
        if: ${{ runner.environment == 'github-hosted' && inputs.pytest-select == 'affected' }}
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project-directory }}
          KEY_PREFIX: testmon-${{ runner.os }}-${{ inputs.python-version }}
        run: |
          echo "prefix=$KEY_PREFIX-$(printf '%s' "$PROJECT_DIR" | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
      - name: Restore testmon data (hosted, pull_request)
        id: testmon-restore
        if: ${{ runner.environment == 'github-hosted' && inputs.pytest-select == 'affected' && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testmon-hosted/.testmondata
          key: ${{ steps.testmon-key.outputs.prefix }}${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ steps.testmon-key.outputs.prefix }}
      # pytest-select=affected: decide, before running anything, whether this run may use testmon
      # data, and say which mode ran and why. Every doubt resolves to the full suite.
      - name: Select tests (full or affected)
        shell: bash
        env:
          PYTEST_SELECT: ${{ inputs.pytest-select }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
          TOOL_CACHE: ${{ runner.tool_cache }}
          PROJECT_DIR: ${{ inputs.project-directory }}
          HOSTED_KEY_PREFIX: ${{ steps.testmon-key.outputs.prefix }}
          HOSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOSTED_RESTORED_KEY: ${{ steps.testmon-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          decide() {
            echo "PYTEST_MODE=$1" >> "$GITHUB_ENV"
            echo "PYTEST_MODE_REASON=$2" >> "$GITHUB_ENV"
            echo "pytest mode: $1 ($2)"
            printf '### pytest mode: %s\n\n%s\n\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          safe() { printf '%s' "$1" | tr -c 'A-Za-z0-9._/\n-' '_' | sed 's#\.\.#__#g'; }

          case "$PYTEST_SELECT" in
            all|affected) ;;
            *) echo "::error::pytest-select must be 'all' or 'affected', got '$PYTEST_SELECT'"; exit 1 ;;
          esac
          [ "$PYTEST_SELECT" = affected ] || decide full "pytest-select=all"

          # Self-hosted runners keep testmon data per repo and base branch on the runner host.
          # Hosted runners get one file, restored by actions/cache into $RUNNER_TEMP/testmon-hosted.
          hosted_file="$RUNNER_TEMP/testmon-hosted/.testmondata"
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && selfhosted=1 || selfhosted=0
          store="$TOOL_CACHE"
          work="$RUNNER_TEMP/testmon"
          rm -rf "$work"; mkdir -p "$work"
          echo "TESTMON_DATAFILE=$work/.testmondata" >> "$GITHUB_ENV"

          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            if [ "$selfhosted" = 1 ]; then
              echo "PYTEST_PUBLISH_FILE=$store/testmon/$(safe "$REPOSITORY")/$(safe "$REF_NAME")/$GITHUB_SHA.testmondata" >> "$GITHUB_ENV"
            else
              # The Save step below uploads this file under the key ...-$GITHUB_SHA.
              echo "PYTEST_PUBLISH_FILE=$hosted_file" >> "$GITHUB_ENV"
            fi
            decide refresh "push to $DEFAULT_BRANCH: full suite, recording testmon data for $GITHUB_SHA"
          fi
          [ "$EVENT_NAME" = pull_request ] || decide full "event $EVENT_NAME is not a pull_request (affected mode is PR-only)"

          git rev-parse --verify -q 'HEAD^2' > /dev/null || decide full "checkout is not a merge commit; cannot tell what the PR changed"
          base=$(git rev-parse 'HEAD^1')
          if [ "$selfhosted" = 1 ]; then
            data="$store/testmon/$(safe "$REPOSITORY")/$(safe "$BASE_REF")/$base.testmondata"
            [ -s "$data" ] || decide full "no testmon data for base ${base:0:12} in ${data%/*} (none recorded, or recorded for another base commit)"
            origin="testmon data for base ${base:0:12}"
          else
            data="$hosted_file"
            [ -s "$data" ] || decide full "no testmon data restored from the actions cache for base ${base:0:12} (none saved yet, or evicted)"
            if [ "$HOSTED_RESTORED_KEY" = "$HOSTED_KEY_PREFIX$HOSTED_BASE_SHA" ]; then
              origin="testmon data for base ${base:0:12}"
            else
              origin="testmon data from an older base (${HOSTED_RESTORED_KEY:-unknown key}); stale data only selects more tests"
            fi
          fi

          changed=$(git diff --name-only 'HEAD^1' HEAD)
          trigger=$(printf '%s\n' "$changed" | grep -E '(^|/)(conftest\.py|pyproject\.toml|uv\.lock|setup\.cfg|pytest\.ini|tox\.ini)$|^\.github/workflows/' | head -n 3 | paste -sd, - || true)
          [ -z "$trigger" ] || decide full "PR touches test-wide config ($trigger)"

          # testmon only fingerprints Python it saw run, under its rootdir. So affected mode is used
          # only when every changed file is a .py file under the project directory. Anything else
          # (data, templates, JSON, markdown a test may read, extensionless scripts, Python outside
          # the project such as a workspace sibling) runs the full suite. Paths are repo-relative.
          proj="${PROJECT_DIR#./}"; proj="${proj%/}"; [ "$proj" != . ] || proj=""
          untracked=$(printf '%s\n' "$changed" | awk -v p="$proj" 'NF { inproj = (p == "" || index($0, p "/") == 1); if (!(inproj && $0 ~ /\.py$/)) print }' | head -n 3 | paste -sd, - || true)
          [ -z "$untracked" ] || decide full "PR changes files testmon cannot track ($untracked); affected mode needs every change to be a .py file under ${proj:-the repo}"

          cp "$data" "$work/.testmondata"
          [ -z "$changed" ] || echo "PYTEST_CHANGED_UNDER_PROJECT=1" >> "$GITHUB_ENV"
          decide affected "$origin; PR changes: $(printf '%s\n' "$changed" | wc -l) .py file(s) under ${proj:-the repo}"
      # junit-xml goes to RUNNER_TEMP (outside the workspace, so it cannot be committed or
      # picked up by a repo's own globbing); the next two steps read it even when pytest failed.
      - name: Run pytest
        env:
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
          JUNIT_XML: ${{ runner.temp }}/pytest-junit.xml
          TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          # Right-size workers. Self-hosted: join the busy-jobs lock dir for the life of this step
          # (the trap leaves it on any exit). Locks older than GitHub's 360-minute job maximum are
          # leftovers from a killed runner and are pruned: one fixed bound, because jobs sharing this
          # dir have different timeout-minutes and must not delete each other's live locks. The lock
          # records pid, run and start time so a stale one is recognisable. Count includes this job.
          CPU_MAX_FILE="${CPU_MAX_FILE:-/sys/fs/cgroup/cpu.max}"
          resolve_workers() {
            case "$PYTEST_WORKERS" in
              auto) ;;
              ''|*[!0-9]*) echo "::error::pytest-workers must be a number or 'auto', got '$PYTEST_WORKERS'"; exit 1 ;;
              *) return 0 ;;
            esac
            local cap quota period busy=1
            cap=$(nproc)
            if [ -r "$CPU_MAX_FILE" ]; then
              read -r quota period < "$CPU_MAX_FILE" || true
              if [ "${quota:-max}" != max ] && [ "${period:-0}" -gt 0 ]; then cap=$((quota / period)); fi
            fi
            [ "$cap" -ge 1 ] || cap=1
            if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
              busy=$(find "$LOCK_DIR" -maxdepth 1 -type f | wc -l)
              [ "$busy" -ge 1 ] || busy=1
              eff=$(( cap < 8 ? cap : 8 ))
              PYTEST_WORKERS=$(( eff / busy ))
            else
              # Hosted runners are not shared between jobs: every core is ours.
              busy=1
              cap=$(nproc)
              PYTEST_WORKERS=$cap
            fi
            [ "$PYTEST_WORKERS" -ge 1 ] || PYTEST_WORKERS=1
            echo "pytest workers: auto -> $PYTEST_WORKERS (cap_cores=$cap, busy_jobs=$busy)"
            printf 'pytest workers: auto -> %s (cap_cores=%s, busy_jobs=%s)\n\n' "$PYTEST_WORKERS" "$cap" "$busy" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            LOCK_DIR="$TOOL_CACHE/busy-jobs"
            mkdir -p "$LOCK_DIR"
            find "$LOCK_DIR" -maxdepth 1 -type f -mmin +360 -delete 2>/dev/null || true
            lock="$LOCK_DIR/${GITHUB_REPOSITORY//\//_}.${GITHUB_RUN_ID:-0}.${GITHUB_JOB:-job}.$$"
            printf 'pid=%s run=%s attempt=%s job=%s started=%s\n' "$$" "${GITHUB_RUN_ID:-0}" "${GITHUB_RUN_ATTEMPT:-1}" "${GITHUB_JOB:-job}" "$(date -u +%FT%TZ)" > "$lock"
            trap 'rm -f "$lock"' EXIT
          fi
          resolve_workers
          run_full() {
            if [ "${PYTEST_WORKERS:-0}" -gt 0 ]; then
              # Into the environment `uv sync --frozen` just built, then run it as synced (--no-sync).
              # `uv run --with` (the first version, ci-harness#42) ran pytest without the project's own
              # dependencies: project-home#188 failed with "No module named 'fastapi'".
              uv pip install --quiet pytest-xdist
              uv run --no-sync pytest -n "$PYTEST_WORKERS" --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }}
            else
              uv run pytest --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }}
            fi
          }
          summary() { printf '%s\n\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          case "${PYTEST_MODE:-full}" in
            affected)
              # testmon runs serial: no -n here. --testmon-forceselect keeps selection on when
              # pytest-args carry -k/-m, which testmon would otherwise answer with the full suite.
              uv pip install --quiet "pytest-testmon>=2.1,<3"
              rc=0
              uv run --no-sync pytest --testmon --testmon-forceselect --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }} || rc=$?
              # testmon selecting nothing is exit 5 on some versions and exit 0 ("no tests ran") on
              # others, so count the tests in the junit file instead of trusting the exit code.
              # An unreadable count is a doubt: it counts as zero. A real failure (rc not 0 or 5) stays one.
              selected=$(grep -o -m1 ' tests="[0-9]*"' "$JUNIT_XML" 2>/dev/null | grep -o '[0-9]*' || true)
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
                exit "$rc"
              elif [ "$rc" -eq 5 ] || [ "${selected:-0}" -eq 0 ]; then
                if [ "${PYTEST_CHANGED_UNDER_PROJECT:-}" = 1 ]; then
                  echo "::notice::testmon selected zero tests although files changed under the project; running the full suite"
                  summary "### pytest mode: full (fallback)"$'\n\n'"testmon selected zero tests although files changed under the project, so the full suite ran."
                  run_full
                else
                  summary "### pytest mode: affected"$'\n\n'"testmon selected zero tests and the PR changed no files."
                fi
              fi
              ;;
            refresh)
              # Serial on purpose: pytest-testmon with xdist is only probed (informational) by the
              # self-smoke affected-fixture job, not proven, and bad recorded data would make every
              # later `affected` run select too little. A push to the default branch is rare, so
              # the slower refresh is the cheaper risk. Switch to -n once that probe is proven.
              # Record while running everything. Publish only a green run with a non-empty db, so a
              # failing main never replaces good data, then drop older files for this branch.
              uv pip install --quiet "pytest-testmon>=2.1,<3"
              uv run --no-sync pytest --testmon-noselect --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }}
              if [ -s "$TESTMON_DATAFILE" ]; then
                mkdir -p "${PYTEST_PUBLISH_FILE%/*}"
                cp "$TESTMON_DATAFILE" "$PYTEST_PUBLISH_FILE.tmp.$$"
                mv "$PYTEST_PUBLISH_FILE.tmp.$$" "$PYTEST_PUBLISH_FILE"
                find "${PYTEST_PUBLISH_FILE%/*}" -maxdepth 1 -name '*.testmondata' ! -name "${PYTEST_PUBLISH_FILE##*/}" -delete
                echo "PYTEST_PUBLISHED=1" >> "$GITHUB_ENV"
                summary "testmon data published: ${PYTEST_PUBLISH_FILE}"
              else
                summary "testmon wrote no data; nothing published."
              fi
              ;;
            *) run_full ;;
          esac
      # Only a green refresh run reaches here with PYTEST_PUBLISHED=1 (the Run pytest step failed
      # otherwise). Keys are per commit, so a save never collides with an older entry.
      - name: Save testmon data (hosted, push to default branch)
        if: ${{ success() && runner.environment == 'github-hosted' && inputs.pytest-select == 'affected' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && env.PYTEST_PUBLISHED == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testmon-hosted/.testmondata
          key: ${{ steps.testmon-key.outputs.prefix }}${{ github.sha }}
      # Failing test names and short tracebacks only, written to the job summary so a red run
      # is readable without opening the raw log. Passing tests are never listed.
      - name: Pytest failures to job summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JUNIT_XML: ${{ runner.temp }}/pytest-junit.xml
        run: |
          if [ ! -s "$JUNIT_XML" ]; then
            echo "### pytest: no test report was written (pytest did not start, or failed during collection); read the pytest step log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$JUNIT_XML" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          MAX_TESTS, MAX_LINES = 20, 12
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          bad = []
          for case in root.iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is not None:
                      name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                      # pytest puts the traceback in the element text; other writers put it
                      # in the message attribute. Keep both, message first.
                      parts = [node.get("message") or "", node.text or ""]
                      text = "\n".join(p.strip() for p in parts if p.strip()).splitlines()
                      bad.append((kind, name, text))
          if not bad:
              print(f"### pytest: {totals['tests']} tests, no failures")
              sys.exit(0)
          print(f"### pytest: {len(bad)} failing of {totals['tests']} tests ({totals['skipped']} skipped)")
          for kind, name, text in bad[:MAX_TESTS]:
              tail = text[-MAX_LINES:]
              print(f"\n**{kind}** `{name}`\n\n```")
              print("\n".join(tail))
              print("```")
          if len(bad) > MAX_TESTS:
              print(f"\n... {len(bad) - MAX_TESTS} more failing tests; see the pytest-junit artifact")
          PY
