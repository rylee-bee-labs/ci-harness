name: reusable-python

# ci-harness — reusable Python pipeline (workflow_call).
#
# Harness-owned mechanics: checkout (pinned), setup-python, uv bootstrap,
# `uv sync --frozen`, and invocation of the repo-given pytest command.
# Repo-owned semantics: which extras to sync, which pytest arguments gate
# the build, and which extra repo gates run after the tests.
#
# Every action SHA below comes from pins/ACTIONS.md — the single pinning
# source. Consumers declare ~5 lines per job; see README.md.
#
# Telemetry: every job emits a pipeline span and a job span through
# scripts/otel-span.sh, using OpenTelemetry's CI/CD and VCS semantic
# conventions (homelab docs/observability/TELEMETRY-CONTRACT.md §3). OpenTelemetry
# observes the estate,
# it never becomes the estate — the pytest/ruff/bandit exit codes stay the gate,
# and every telemetry step is continue-on-error so an OTLP failure can never
# fail a job. Unset endpoint means the whole thing is off.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      python-version:
        description: CPython version for the test interpreter.
        type: string
        required: false
        default: "3.12"
      uv-version:
        description: Exact uv version bootstrapped via pip.
        type: string
        required: false
        default: "0.11.28"
      project-directory:
        description: Directory holding pyproject.toml and uv.lock.
        type: string
        required: false
        default: "."
      sync-args:
        description: >-
          Extra arguments for `uv sync --frozen`, e.g.
          "--extra test --extra crypto".
        type: string
        required: false
        default: ""
      pytest-args:
        description: >-
          Arguments for `uv run pytest` — the repo's real test invocation.
          Quote-bearing arguments (e.g. -k "A or B") keep their shell
          meaning: this text is expanded into the run command, exactly as
          if the repo had written the step itself.
        type: string
        required: false
        default: ""
      pytest-workers:
        description: >-
          Parallel pytest workers (pytest-xdist, installed into the synced
          environment for this run only, so no repo lockfile changes). 0 = serial, the
          default. Opt in per repo only after its suite has passed in parallel
          (2026-10-10: agent-platform 633 s -> 173 s on 6 workers, all green).
        type: number
        required: false
        default: 0
      timeout-minutes:
        description: >-
          Timeout for every job in this workflow (test, ruff, bandit), in minutes. A hung
          job otherwise holds a runner for GitHub's 360-minute default.
        type: number
        required: false
        default: 30
      junit-artifact-name:
        description: >-
          Name of the uploaded pytest junit-xml artifact. Artifact names must be unique per
          workflow run: override when calling this template more than once from one caller.
        type: string
        required: false
        default: pytest-junit
      post-test-commands:
        description: >-
          Shell lines to run in the synced environment after pytest passes,
          for repo-owned gates that are not pytest (validators, censuses).
          Executed under `set -euo pipefail`; first non-zero exit fails the job.
        type: string
        required: false
        default: ""
      enable-ruff:
        description: >-
          Add a separate ruff lint job. ruff must come from the repo's own
          uv.lock (the job runs `uv run ruff`).
        type: boolean
        required: false
        default: false
      ruff-args:
        description: Arguments for `uv run ruff`.
        type: string
        required: false
        default: "check ."
      enable-bandit:
        description: >-
          Add a separate bandit scan job. bandit must come from the repo's
          own uv.lock (the job runs `uv run bandit`).
        type: boolean
        required: false
        default: false
      bandit-args:
        description: Arguments for `uv run bandit`.
        type: string
        required: false
        default: "-q -r ."

permissions:
  contents: read

jobs:
  test:
    name: python tests
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.project-directory }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-python:test
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Bootstrap uv
        run: pip install uv==${{ inputs.uv-version }}
      - name: Sync locked dependencies
        run: uv sync --frozen ${{ inputs.sync-args }}
      # junit-xml goes to RUNNER_TEMP (outside the workspace, so it cannot be committed or
      # picked up by a repo's own globbing); the next two steps read it even when pytest failed.
      - name: Run pytest
        env:
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
          JUNIT_XML: ${{ runner.temp }}/pytest-junit.xml
        run: |
          if [ "${PYTEST_WORKERS:-0}" -gt 0 ]; then
            # Into the environment `uv sync --frozen` just built, then run it as synced (--no-sync).
            # `uv run --with` (the first version, ci-harness#42) ran pytest without the project's own
            # dependencies: project-home#188 failed with "No module named 'fastapi'".
            uv pip install --quiet pytest-xdist
            uv run --no-sync pytest -n "$PYTEST_WORKERS" --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }}
          else
            uv run pytest --junit-xml="$JUNIT_XML" ${{ inputs.pytest-args }}
          fi
      # Failing test names and short tracebacks only, written to the job summary so a red run
      # is readable without opening the raw log. Passing tests are never listed.
      - name: Pytest failures to job summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JUNIT_XML: ${{ runner.temp }}/pytest-junit.xml
        run: |
          [ -s "$JUNIT_XML" ] || exit 0
          python3 - "$JUNIT_XML" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          MAX_TESTS, MAX_LINES = 20, 12
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          bad = []
          for case in root.iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is not None:
                      name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                      text = (node.text or node.get("message") or "").strip().splitlines()
                      bad.append((kind, name, text))
          if not bad:
              print(f"### pytest: {totals['tests']} tests, no failures")
              sys.exit(0)
          print(f"### pytest: {len(bad)} failing of {totals['tests']} tests ({totals['skipped']} skipped)")
          for kind, name, text in bad[:MAX_TESTS]:
              tail = text[-MAX_LINES:]
              print(f"\n**{kind}** `{name}`\n\n```")
              print("\n".join(tail))
              print("```")
          if len(bad) > MAX_TESTS:
              print(f"\n... {len(bad) - MAX_TESTS} more failing tests; see the pytest-junit artifact")
          PY
      - name: Upload pytest junit-xml
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.junit-artifact-name }}
          path: ${{ runner.temp }}/pytest-junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Repo-owned post-test gates
        if: ${{ inputs.post-test-commands != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.post-test-commands }}

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true

  ruff:
    name: ruff
    if: ${{ inputs.enable-ruff }}
    runs-on: ${{ inputs.runs-on }}
