name: reusable-container-smoke

# ci-harness — reusable container build + health smoke (workflow_call).
#
# Harness-owned mechanics: docker build from the repo's Dockerfile, an
# optional detached `docker run`, a configurable healthz curl retry loop,
# and container-log capture when the smoke fails.
# Repo-owned semantics: build context and flags, run flags (port mapping,
# env), the endpoint, and the retry budget.
#
# healthz-url empty → build-only mode (the image is built but not started).
# No registry login or push happens here; publishing is a different,
# more privileged concern and stays in the owning repo's pipeline.
#
# Optional flag inputs (build-args, run-args) are whitespace-split into
# argument arrays — pass tokens without embedded quotes (e.g. -p 8080:80),
# not quoted phrases.

on:
  workflow_call:
    inputs:
      image-name:
        description: Local tag for the built image.
        type: string
        required: false
        default: "ci-harness-smoke:local"
      build-context:
        description: Docker build context directory.
        type: string
        required: false
        default: "."
      dockerfile:
        description: Dockerfile path; empty uses <build-context>/Dockerfile.
        type: string
        required: false
        default: ""
      build-args:
        description: Extra `docker build` flags (whitespace-separated tokens).
        type: string
        required: false
        default: ""
      run-args:
        description: >-
          Extra `docker run` flags placed before -d, e.g.
          "-p 8080:8080 -e APP_TOKEN=ci-placeholder".
        type: string
        required: false
        default: ""
      healthz-url:
        description: >-
          URL polled with curl until green; empty means build-only
          (container is not started).
        type: string
        required: false
        default: ""
      healthz-attempts:
        description: Maximum health polling attempts before failing.
        type: number
        required: false
        default: 30
      healthz-delay-seconds:
        description: Sleep between health polling attempts.
        type: number
        required: false
        default: 2

permissions:
  contents: read

jobs:
  smoke:
    name: container smoke
    runs-on: ubuntu-latest
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-container-smoke:smoke
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
# This template has no `runs-on` input — the job is pinned to
          # ubuntu-latest above, so that literal is the runner label.
          OTELSPAN_RUNNER_LABEL: ubuntu-latest
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi

      - name: docker build
        env:
          IMAGE: ${{ inputs.image-name }}
          CONTEXT: ${{ inputs.build-context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          dockerfile_args=()
          if [ -n "$DOCKERFILE" ]; then
            dockerfile_args+=(-f "$DOCKERFILE")
          fi
          read -r -a extra_build_args <<< "$BUILD_ARGS"
          docker build -t "$IMAGE" \
            "${dockerfile_args[@]}" \
            "${extra_build_args[@]}" \
            "$CONTEXT"

      - name: docker run (detached)
        if: ${{ inputs.healthz-url != '' }}
        env:
          IMAGE: ${{ inputs.image-name }}
          RUN_ARGS: ${{ inputs.run-args }}
        run: |
          set -euo pipefail
          read -r -a extra_run_args <<< "$RUN_ARGS"
          docker run --rm --name ci-harness-smoke "${extra_run_args[@]}" -d "$IMAGE"

      - name: Wait for healthz
        if: ${{ inputs.healthz-url != '' }}
        env:
          URL: ${{ inputs.healthz-url }}
          ATTEMPTS: ${{ inputs.healthz-attempts }}
          DELAY: ${{ inputs.healthz-delay-seconds }}
        run: |
          set -eu
          ready=false
          for ((i = 1; i <= ATTEMPTS; i++)); do
            if curl -fsS --max-time 5 "$URL" > /dev/null; then
              echo "healthz green on attempt ${i}/${ATTEMPTS}"
              ready=true
              break
            fi
            sleep "$DELAY"
          done
          if [ "$ready" != true ]; then
            echo "::error::healthz ${URL} never became green in ${ATTEMPTS} attempts"
            exit 1
          fi

      - name: Dump container logs on failure
        if: ${{ failure() && inputs.healthz-url != '' }}
        run: docker logs ci-harness-smoke || true

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true
