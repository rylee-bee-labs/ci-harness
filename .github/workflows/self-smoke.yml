name: self-smoke

# Real-execution proof for the workflow_call templates: each job below
# calls one of this repo's own reusable workflows against a small fixture
# under fixtures/. actionlint-selfcheck.yml proves static parsing; this
# proves the call contract, the pinned actions resolve, `uv sync --frozen`
# works from a committed lockfile, `npm ci` + build + artifact upload work,
# docker build + run + healthz retry loop works end to end, and the
# contract-freshness gate fails closed. The stale-pin probe's tool run MUST
# exit nonzero; because GitHub forbids continue-on-error on uses: jobs, the
# red path is proven as a positive assertion: the reusable's
# `expect: noncurrent` inversion goes green exactly when the tool goes red,
# and a following job asserts the probe's propagated nonzero exit rather
# than trusting a tolerated red at face value.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The node template's upload-dist step needs actions: write; granted here
  # at the calling level so the reusable workflow stays inside caller caps.
  actions: write

concurrency:
  group: self-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-home:
    name: Project Home reporter contract
    uses: ./.github/workflows/reusable-project-home.yml
    with:
      action: notice
      notice-key: self-smoke
      notice-title: "ci-harness self-smoke"
      notice-body: "request construction only"
      self-smoke: true

  # The telemetry helper, proven by the only means CI has offline: a throwaway
  # OTLP receiver on 127.0.0.1 and assertions about the bodies that arrive. It
  # is the executable half of scripts/otel-span.sh; the job below proves the
  # templates drive it correctly.
  otel-selftest:
    name: OpenTelemetry span helper self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the span helper's own self-test
        run: bash scripts/otel-span.sh --self-test

  # What the templates actually do: run their two telemetry steps against a live
  # receiver, in a job whose HEAD commit carries an Estate-Task trailer, and
  # assert the spans that come back. Plus a structural assertion that every
  # template keeps the pair, and that neither step can ever fail a job — the one
  # thing static lint cannot prove and a swallowed red would hide.
  otel-template-wiring:
    name: telemetry wiring in every template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every template carries the telemetry pair, and it cannot fail a job
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          import yaml

          problems = []
          templates = sorted(glob.glob(".github/workflows/reusable-*.yml"))
          for path in templates:
              doc = yaml.safe_load(open(path, encoding="utf-8"))
              for job, body in doc.get("jobs", {}).items():
                  assert "uses" not in body, f"{path}:{job} is a `uses:` job"
                  steps = {s.get("name"): s for s in body.get("steps", []) if s.get("name")}

                  context = steps.get("OpenTelemetry context")
                  if context is None:
                      problems.append(f"{path}:{job} has no 'OpenTelemetry context' step")
                  else:
                      if context.get("continue-on-error") is not True:
                          problems.append(f"{path}:{job} 'OpenTelemetry context' can fail the job")
                      if "vars.OTEL_EXPORTER_OTLP_ENDPOINT" not in str(
                              (context.get("env") or {}).get("OTEL_EXPORTER_OTLP_ENDPOINT", "")):
                          problems.append(f"{path}:{job} does not read the standard endpoint variable")

                  # The reporter is one step doing all four actions, so its spans
                  # are emitted inside that step rather than as a closing one; the
                  # assertion there is that it emits them AND hands Project Home a
                  # traceparent plus the Estate-Task ids in the header the body
                  # consumer never has to learn about. Every other template has
                  # the closing pair.
                  if path.endswith("reusable-project-home.yml"):
                      script = "\n".join(str(s.get("run", "")) for s in body.get("steps", []))
                      for needle in ("ci-emit", "traceparent", "Estate-Task", "|| true"):
                          if needle not in script:
                              problems.append(f"{path}:{job} never sends {needle!r}")
                      # One interface: the ids ride the header, never the body.
                      if "mission_id" in script.split("self-smoke is reserved")[0]:
                          problems.append(f"{path}:{job} puts a mission id in a request body")
                      continue

                  spans = steps.get("OpenTelemetry spans")
                  if spans is None:
                      problems.append(f"{path}:{job} has no 'OpenTelemetry spans' step")
                      continue
                  if spans.get("continue-on-error") is not True:
                      problems.append(f"{path}:{job} 'OpenTelemetry spans' can fail the job")
                  if "always()" not in str(spans.get("if", "")):
                      problems.append(f"{path}:{job} 'OpenTelemetry spans' is not `if: always()`")
                  if "OTELSPAN_ENV_FILE" not in (spans.get("env") or {}):
                      problems.append(f"{path}:{job} 'OpenTelemetry spans' ignores the context it computed")
              if problems:
                  print("\n".join(problems), file=sys.stderr)
                  raise SystemExit(1)
              print(f"OK {path}: every job emits a pipeline-role span and a job span, neither can fail it")
          PY
      - name: Run one template job's telemetry steps against a live receiver
        run: |
          set -euo pipefail
          # A PR a mission lands carries this trailer on its HEAD commit; the
          # template's context step reads it and joins that task's trace.
          repo="$RUNNER_TEMP/mission-pr"
          git init -q "$repo"
          git -C "$repo" -c user.email=t@t -c user.name=t commit -q --allow-empty \
            -m "feat: land the thing

          Estate-Task: m7/T42"

          python3 - "$RUNNER_TEMP/rx" <<'PY' &
          import http.server, json, os, sys
          outdir = sys.argv[1]
          os.makedirs(outdir, exist_ok=True)

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def do_POST(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  with open(os.path.join(outdir, "spans.jsonl"), "a", encoding="utf-8") as fh:
                      fh.write(json.dumps(json.loads(self.rfile.read(n) or b"{}")) + "\n")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", "2")
                  self.end_headers()
                  self.wfile.write(b"{}")

              def log_message(self, *args):
                  pass

          srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(os.path.join(outdir, "port"), "w", encoding="utf-8") as fh:
              fh.write(str(srv.server_address[1]))
          srv.serve_forever()
          PY
          receiver=$!
          for _ in $(seq 1 100); do
            [ -s "$RUNNER_TEMP/rx/port" ] && break
            sleep 0.1
          done
          port=$(cat "$RUNNER_TEMP/rx/port")
          trap 'kill "$receiver" 2>/dev/null || true' EXIT

          # Exactly the two steps reusable-python.yml runs, same env, same helper.
          export OTELSPAN_HELPER="$RUNNER_TEMP/otel-span.sh"
          export OTELSPAN_ENV_FILE="$RUNNER_TEMP/otel-ctx.env"
          export OTEL_EXPORTER_OTLP_ENDPOINT="http://127.0.0.1:$port"
          export OTEL_SERVICE_NAME="ci-harness"
          export OTELSPAN_JOB_KEY="reusable-python:test"
          export OTELSPAN_PIPELINE_NAME="self-smoke"
          export OTELSPAN_RUN_ID="4242"
          export OTELSPAN_RUN_ATTEMPT="1"
          export OTELSPAN_REPOSITORY="rylee-bee-labs/ci-harness"
          export OTELSPAN_REF_HEAD="otel/ci-19"
          export OTELSPAN_HEAD_REVISION="cccccccccccccccccccccccccccccccccccccccc"
          export OTELSPAN_CHANGE_ID="314"
          export OTELSPAN_RUNNER_LABEL="bazzite"
          cp scripts/otel-span.sh "$OTELSPAN_HELPER"

          ( cd "$repo" && bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" )
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result success
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result success

          sleep 0.5
          python3 - "$RUNNER_TEMP/rx/spans.jsonl" <<'PY'
          import hashlib, json, sys

          spans = []
          for line in open(sys.argv[1], encoding="utf-8"):
              body = json.loads(line)
              for rs in body["resourceSpans"]:
                  for ss in rs["scopeSpans"]:
                      for span in ss["spans"]:
                          attrs = {a["key"]: list(a["value"].values())[0] for a in span["attributes"]}
                          span["attrs"] = attrs
                          spans.append(span)

          want_trace = hashlib.sha256(b"estate-task|m7|T42").hexdigest()[:32]
          want_root = hashlib.sha256(b"estate-task-root|m7|T42").hexdigest()[:16]
          by_name = {s["name"]: s for s in spans}
          assert set(by_name) == {"ci.pipeline.run", "ci.job.run"}, f"got {sorted(by_name)}"
          pipeline, job = by_name["ci.pipeline.run"], by_name["ci.job.run"]

          # The pipeline-role span carries the run's identity but the JOB's
          # interval: it starts where this job's context step ran, because no
          # job can see the pipeline's own extent. Asserted so the README's
          # "read a duration off it as a job's slice" cannot go quietly false.
          assert pipeline["startTimeUnixNano"] == job["startTimeUnixNano"], (
              pipeline["startTimeUnixNano"], job["startTimeUnixNano"]
          )

          # The PR joined the mission task's trace, computed from the ids alone.
          assert pipeline["traceId"] == job["traceId"] == want_trace, pipeline["traceId"]
          assert pipeline["parentSpanId"] == want_root, pipeline.get("parentSpanId")
          assert job["parentSpanId"] == pipeline["spanId"], job.get("parentSpanId")

          for span in (pipeline, job):
              for key, value in (
                  ("cicd.pipeline.name", "self-smoke"),
                  ("cicd.pipeline.run.id", "4242"),
                  ("cicd.pipeline.result", "success"),
                  ("cicd.worker.name", "bazzite"),
                  ("vcs.repository.name", "ci-harness"),
                  ("vcs.ref.head.name", "otel/ci-19"),
                  ("vcs.change.id", "314"),
                  ("estate.host.class", "bazzite"),
                  ("estate.actor.kind", "ci"),
                  ("estate.mission.id", "m7"),
                  ("estate.task.id", "T42"),
              ):
                  assert span["attrs"].get(key) == value, f"{span['name']}: {key}={span['attrs'].get(key)!r}"

          assert job["attrs"]["cicd.pipeline.task.name"] == "reusable-python:test"
          assert job["attrs"]["cicd.pipeline.task.run.result"] == "success"
          assert len(job["attrs"]["cicd.pipeline.task.run.id"]) == 32

          # Nothing private: no bearer token, no host name, no home path, no URL.
          blob = json.dumps(spans)
          for banned in ("Bearer", "/home/", "/var/home", "127.0.0.1", "://"):
              assert banned not in blob, f"span body leaked {banned!r}"

          print(f"OK: the template's own steps joined trace {want_trace[:12]}… "
                f"and sent a pipeline-role span and a job span carrying the standard conventions")
          PY

  python:
    name: python template
    uses: ./.github/workflows/reusable-python.yml
    with:
      project-directory: "fixtures/py-demo"
      sync-args: "--extra test"
      pytest-args: "--timeout=30 -q"

  # The template's selection step, called for real (hosted runner: no testmon store, so it must say
  # "full" and why).
  python-affected-select:
    name: python template, pytest-select=affected
    uses: ./.github/workflows/reusable-python.yml
    with:
      project-directory: "fixtures/py-demo"
      sync-args: "--extra test"
      pytest-args: "--timeout=30 -q"
      pytest-select: affected
      junit-artifact-name: pytest-junit-affected

  # testmon itself, on a fixture repo: record, change one module, only its test is selected; a
  # change with no covering test selects zero test node ids, which the template turns into a full
  # run; and xdist + testmon is probed and reported (informational: the template runs testmon
  # serial).
  #
  # Nothing about pytest-testmon is assumed here, because this job IS the proof that the
  # template's affected mode works: which flags exist is read out of `pytest --help` of the
  # interpreter that runs the tests, and "testmon selected nothing" is read out of the junit
  # report rather than out of one exit code. Each phase prints a banner before it starts and its
  # counts after, so a red log names the phase that never finished.
  affected-fixture:
    name: testmon select/fallback on a fixture repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prove selection with real pytest-testmon
        run: |
          set -euo pipefail
          say() { printf '%s\n' "$*"; }
          fail() { say "::error::$*"; exit 1; }

          venv="$RUNNER_TEMP/venv"
          python3 -m venv "$venv"
          # Into the venv, for this job only, and with no version bounds: a bound nobody can
          # check from here fails the job during resolution, before it proves anything.
          "$venv/bin/pip" install --quiet pytest pytest-testmon pytest-xdist
          export PATH="$venv/bin:$PATH"   # so pytest and python3 below are the venv's

          say "interpreter: $(python3 -c 'import sys; print(sys.executable, sys.version.split()[0])')"
          say "pytest: $(pytest --version 2>&1 | head -n 1)"
          say "pytest-testmon: $("$venv/bin/pip" show pytest-testmon | sed -n 's/^Version: /version /p')"

          # The flags reusable-python.yml passes must exist in THIS pytest. A missing one is a
          # hard error naming the flag, followed by every testmon flag this pytest does offer.
          options=$(pytest --help 2>&1)
          for flag in testmon testmon-noselect testmon-forceselect; do
            if ! printf '%s\n' "$options" | grep -qE -- "^[[:space:]]+--${flag}([[:space:]]|$)"; then
              say "::error::the installed pytest-testmon has no --$flag, which reusable-python.yml passes in affected mode"
              printf '%s\n' "$options" | grep -o -- '--testmon[a-z-]*' | sort -u || true
              exit 1
            fi
          done
          say "testmon flags present: --testmon --testmon-noselect --testmon-forceselect"

          work="$RUNNER_TEMP/affected"
          rm -rf "$work"
          cp -r fixtures/affected-demo "$work"
          cd "$work"                       # the fixture is its own rootdir from here on
          export TESTMON_DATAFILE="$work/.testmondata"

          # Node ids of a junit report: the evidence, and the zero-selection signal.
          nodes() {
            python3 - "$1" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ids = sorted(f"{c.get('classname', '')}::{c.get('name', '')}".strip(":")
                       for c in ET.parse(sys.argv[1]).getroot().iter("testcase"))
          print("\n".join(ids))
          PY
          }

          # run <report> [pytest args...]: one pytest run, reported as exit code plus node ids.
          # RUN_RC / RUN_N / RUN_IDS are the result: the exit code is evidence, never the
          # decision — "did the selector produce any node ids at all" is the decision.
          run() {
            report="$1"; shift
            rc=0
            pytest -q --junit-xml="$report" "$@" || rc=$?
            ids=$(nodes "$report")
            if [ -n "$ids" ]; then n=$(printf '%s\n' "$ids" | grep -c .); else n=0; fi
            say "  pytest $* -> exit $rc, $n test node id(s)"
            if [ -n "$ids" ]; then printf '%s\n' "$ids" | sed 's/^/    /'; fi
            RUN_RC=$rc; RUN_N=$n; RUN_IDS=$ids
          }

          say "== phase 1/4: record testmon data for the fixture (--testmon-noselect)"
          run j0.xml --testmon-noselect
          [ "$RUN_RC" -eq 0 ] || fail "the record run was not green (exit $RUN_RC)"
          [ "$RUN_N" -eq 2 ] || fail "the record run ran $RUN_N test(s), expected both fixture tests"
          recorded=$RUN_IDS
          if [ -s "$TESTMON_DATAFILE" ]; then
            say "  recorded $RUN_N tests into $TESTMON_DATAFILE ($(wc -c < "$TESTMON_DATAFILE") bytes)"
          else
            say "  ::warning::no testmon data at TESTMON_DATAFILE after the record run"
          fi

          say "== phase 2/4: calc.py changed -> only the test covering it is affected (2 before, 1 expected after)"
          printf '\n# touched\ndef sub(a: int, b: int) -> int:\n    return a - b\n' >> calc.py
          run j1.xml --testmon --testmon-forceselect
          [ "$RUN_RC" -eq 0 ] || fail "the affected run was not green (exit $RUN_RC)"
          [ "$RUN_N" -eq 1 ] || fail "expected 1 selected test after calc.py changed, got $RUN_N: $RUN_IDS"
          case "$RUN_IDS" in *test_add*) ;; *) fail "the selected test is not test_add: $RUN_IDS" ;; esac
          if printf '%s' "$RUN_IDS" | grep -q test_shout; then
            fail "test_shout was selected although only calc.py changed: $RUN_IDS"
          fi

          # Nothing covers this module, so testmon's selection is empty. The template's fallback
          # keys on that empty node id list, which is what is asserted here; the exit code pytest
          # happens to use for an empty selection is reported above, never assumed.
          say "== phase 3/4: a module no test covers selects zero tests -> the template's full-run fallback"
          say 'VALUE = 1' > orphan.py
          run j2.xml --testmon --testmon-forceselect
          [ "$RUN_N" -eq 0 ] || fail "expected zero selected node ids after adding an uncovered module, got: $RUN_IDS"
          say "  the select step produced no test node ids (pytest exit $RUN_RC) -> running the full suite, as the template does"
          run j2b.xml
          [ "$RUN_RC" -eq 0 ] || fail "the full-suite fallback was not green (exit $RUN_RC)"
          [ "$RUN_IDS" = "$recorded" ] || fail "the fallback ran a different set than the record run: $RUN_IDS"

          # Informational: does testmon cooperate with xdist here? The template does not depend on it.
          say "== phase 4/4: informational, does testmon cooperate with xdist here?"
          rc=0
          pytest -q --testmon-noselect -n 2 --junit-xml=j3.xml > /dev/null 2>&1 || rc=$?
          xids=$(nodes j3.xml 2>/dev/null || true)
          if [ "$rc" -eq 0 ] && [ "$xids" = "$recorded" ]; then
            say "  xdist+testmon: works in this setup (the template still runs testmon serial)"
          else
            say "  xdist+testmon: does NOT work in this setup (exit $rc, ids: ${xids:-none}); serial testmon is the pattern"
          fi

          say "OK: recorded both fixture tests, 1 selected after calc.py changed, 0 after an uncovered module, both again through the full-suite fallback"

  node:
    name: node template
    uses: ./.github/workflows/reusable-node.yml
    with:
      working-directory: "fixtures/node-demo"
      build-command: "npm run build"
      lint-command: "npm run lint"
      upload-dist: true
      artifact-name: "fixture-dist"

  container-smoke:
    name: container smoke template
    uses: ./.github/workflows/reusable-container-smoke.yml
    with:
      image-name: "ci-harness-self-smoke:local"
      build-context: "fixtures/container-demo"
      run-args: "-p 8080:80"
      healthz-url: "http://127.0.0.1:8080/"
      healthz-attempts: 30
      healthz-delay-seconds: 2

  # reusable-uat's call contract, proven positively rather than assumed. The
  # fixture exits nonzero if UAT_READONLY never reached the repo-owned command,
  # or if it carried the wrong value for the `read-only` input — so a green run
  # is a real assertion about the wiring, not a silent skip. No browser is
  # needed to prove the contract; the real-browser harness has its own smoke.
  # Both branches of the read-only input are exercised on purpose.
  uat:
    name: uat template (read-only posture arrives as 1)
    uses: ./.github/workflows/reusable-uat.yml
    with:
      working-directory: "fixtures/uat-demo"
      uat-command: "FIXTURE_EXPECT_READONLY=1 FIXTURE_EXPECT_URL=http://127.0.0.1:PORT/uat-url-passthrough npm run uat"
      uat-url: "http://127.0.0.1:PORT/uat-url-passthrough"
      read-only: true
      artifact-name: "fixture-uat"

  uat-writes-permitted:
    name: uat template (read-only off arrives as 0, no artifact)
    uses: ./.github/workflows/reusable-uat.yml
    with:
      working-directory: "fixtures/uat-demo"
      uat-command: "FIXTURE_EXPECT_READONLY=0 npm run uat"
      read-only: false
      upload-artifacts: false

  contract-freshness-current:
    name: contract freshness — current pin (must pass)
    uses: ./.github/workflows/reusable-contract-freshness.yml
    with:
      manifest-path: "fixtures/contract-demo/current-adoption.yaml"

  # Stale-pin probe through the real uses: call, inverted assertion:
  # `expect: noncurrent` makes this job GREEN exactly when the tool
  # correctly exits nonzero with BEHIND/DIVERGED. If the fail-closed gate
  # ever went soft, this job would go red instead. The next job is the
  # explicit, independent assertion of the nonzero exit itself.
  contract-freshness-stale:
    name: contract freshness — stale pin (green iff gate correctly red)
    uses: ./.github/workflows/reusable-contract-freshness.yml
    with:
      manifest-path: "fixtures/contract-demo/stale-adoption.yaml"
      expect: "noncurrent"

  # warn mode: the same stale pin passes, with a warning (PRs in repos
  # with a pin robot); its status output still says the real verdict.
  contract-freshness-warn:
    name: contract freshness — stale pin in warn mode (must pass)
    uses: ./.github/workflows/reusable-contract-freshness.yml
    with:
      manifest-path: "fixtures/contract-demo/stale-adoption.yaml"
      expect: "warn"

  contract-freshness-stale-proven:
    name: assert stale probe exited nonzero
    needs: contract-freshness-stale
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the probe's propagated tool exit code
        env:
          PROBE_RESULT: ${{ needs.contract-freshness-stale.result }}
          PROBE_EXIT: ${{ needs.contract-freshness-stale.outputs.exit-code }}
          PROBE_STATUS: ${{ needs.contract-freshness-stale.outputs.status }}
        run: |
          set -u
          echo "stale probe: job-result=$PROBE_RESULT exit-code='$PROBE_EXIT' status='$PROBE_STATUS'"
          if [ "$PROBE_RESULT" != "success" ]; then
            echo "::error::stale probe job was not green — the inversion itself failed (result=$PROBE_RESULT); check the probe log, do not assume fail-closed works"
            exit 1
          fi
          case "$PROBE_EXIT" in
            1 | 2) ;;
            *)
              echo "::error::fail-closed gate is BROKEN: stale adoption pin produced exit '$PROBE_EXIT' (expected 1 or 2)"
              exit 1
              ;;
          esac
          case "$PROBE_STATUS" in
            BEHIND | DIVERGED)
              echo "OK: stale adoption pin rejected with exit $PROBE_EXIT, status $PROBE_STATUS — the red path is genuinely red"
              ;;
            *)
              echo "::error::stale adoption pin produced status '$PROBE_STATUS' (expected BEHIND or DIVERGED)"
              exit 1
              ;;
          esac

  # Green-path witness that cannot rot: a manifest whose pin is generated
  # LIVE from the remote head must read CURRENT. The committed current-pin
  # fixture above stays honest (it goes red on purpose when the library's
  # contracts or schema move, until a human re-pins it; docs-only moves
  # read CURRENT under its `update: automatic`); this job proves the gate's green
  # verdict tracks the remote rather than a hardcoded constant.
  contract-freshness-live:
    name: contract freshness — live remote sha (expect CURRENT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe a manifest pinned to the LIVE remote main
        run: |
          set -euo pipefail
          # contractctl is stdlib-only; the runner's python3 is enough
          git clone --depth 1 https://github.com/rylee-bee-labs/play-nice-contracts "$RUNNER_TEMP/library"
          sha=$(git ls-remote https://github.com/rylee-bee-labs/play-nice-contracts refs/heads/main | awk '{print $1}')
          test -n "$sha"
          sed "s/@PIN@/$sha/" fixtures/contract-demo/current-template.adoption.yaml > "$RUNNER_TEMP/current.adoption.yaml"
          python3 "$RUNNER_TEMP/library/tools/contractctl/contractctl.py" \
            freshness --manifest "$RUNNER_TEMP/current.adoption.yaml" --json
          echo "CURRENT — live-pinned manifest correctly GREEN"

  # Real-execution proof for the honest-claims template. ci-harness is its own
  # first consumer: it ships policy/, scripts/verify-claim.sh and the drift
  # test at the repo root, so `mirror-path` exercises the comparison branch
  # rather than skipping it. A template whose only proof were static parsing
  # would not prove it fetches the right revision, installs conftest, or runs
  # the canary before trusting a verdict.
  claims-policy:
    name: claims policy template
    uses: ./.github/workflows/reusable-claims-policy.yml
    with:
      # A local `./` reference means the policy under test lives in this very
      # commit, so the head SHA is the right "pinned" revision here. On a
      # pull_request, github.sha is the synthetic merge commit; the head SHA is
      # a real object in this repo and is what carries the new files.
      policy-revision: ${{ github.event.pull_request.head.sha || github.sha }}
      mirror-path: "scripts/verify-claim.sh"
