name: reusable-claims-policy

# ci-harness — honest-claims gate (workflow_call).
#
# Harness-owned mechanics: fetch the canonical policy (policy/claims.rego,
# scripts/verify-claim.sh, tests/test_claim_policy_drift.py) from THIS repo at
# the exact revision the consumer pinned, install conftest, prove the policy
# actually fires, then check the consumer's commit message or PR body against
# it. Repo-owned semantics: which text is checked, and whether the repo ships
# its own bash mirror that must be proven equivalent.
#
# Why the policy is fetched instead of vendored: `reusable-contract-freshness`
# clones play-nice-contracts for the same reason. A vendored copy is a second
# source of truth, and this policy already shipped once as a bash/rego pair
# whose two halves nobody compared. One canonical copy, fetched at a pin, is
# the fix.
#
# The revision comes from the `policy-revision` input, which the caller sets to
# the same SHA it writes in `uses:`. That is NOT redundant: there is no context
# property that exposes a called reusable workflow's own ref. `github.workflow_ref`
# looks like it should, but it resolves to the CALLER's workflow — proven, not
# assumed: ci-harness's own self-smoke logged
#   WORKFLOW_REF: rylee-bee-labs/ci-harness/.github/workflows/self-smoke.yml@refs/pull/28/merge
# i.e. the caller, not reusable-claims-policy.yml. `github.job_workflow_sha` would
# be the right property if it existed; actionlint 1.7.12's schema does not list it
# and the docs page did not confirm it, so this template does not rely on it.
#
# The consequence is a duplicated SHA, so the checkout is VERIFIED after the
# fact: the job asserts the fetched tree really is the requested commit and
# prints it. A caller who bumps `uses:` but forgets the input gets a stale
# policy and a log line that says which SHA actually ran.
#
# Canary before use: conftest reports a POLICY THAT FAILS TO COMPILE with exit
# 1, which is indistinguishable from a policy denial. If claims.rego is broken,
# the canary fires first and says so, instead of the job looking like it denied
# everything.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >-
          Timeout for every job in this workflow, in minutes. A hung job otherwise holds a
          runner for GitHub's 360-minute default.
        type: number
        required: false
        default: 30
      policy-revision:
        description: >-
          ci-harness commit SHA to fetch the policy from — the SAME SHA as the
          `uses:` line that calls this template. Required: there is no context
          property exposing a reusable workflow's own ref. The job verifies the
          checkout landed on it and prints the revision that actually ran.
        type: string
        required: true
      runs-on:
        description: >-
          Runner label for the job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      mirror-path:
        description: >-
          Repo-local path to the bash mirror, e.g. "scripts/verify-claim.sh". When set and the
          file exists, the drift test runs: it compares the consumer's mirror against the
          canonical policy and fails on any disagreement. Leave empty for a repo that does not
          ship a mirror (the usual case — the gate still runs).
        type: string
        required: false
        default: ""
      check:
        description: >-
          Which text to gate. "auto" (default) uses the PR body on pull_request events and the
          HEAD commit message otherwise. Force either with "pr-body" or "commit-message".
        type: string
        required: false
        default: auto

permissions:
  contents: read

jobs:
  claims:
    name: honest-claims policy
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # Where the canonical policy lands. It MUST be under GITHUB_WORKSPACE:
      # actions/checkout refuses any `path:` outside the workspace
      # ("Repository path ... is not under ..."), which is what runner.temp
      # (/home/runner/work/_temp) is. A dot-prefixed subdirectory keeps it
      # out of the consumer's tree without colliding with it.
      HARNESS_SRC: ${{ github.workspace }}/.ci-harness-src
      CHECK: ${{ inputs.check }}
      MIRROR_PATH: ${{ inputs.mirror-path }}
      POLICY_REVISION: ${{ inputs.policy-revision }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin/conftest bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-claims-policy:claims
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise. The tree above is the CALLER's
          # (this template gates the consumer's commit), so the raw fetch is the
          # normal path here — the same as for any consumer of any template.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi

      - name: Resolve and validate the pinned ci-harness revision
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$POLICY_REVISION"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: policy-revision must be a 40-character commit SHA, got: '$rev'" >&2
            echo "       Set it to the same SHA as this template's uses: line." >&2
            exit 1
          fi
          echo "ref=$rev" >> "$GITHUB_OUTPUT"
          echo "requested ci-harness revision: $rev"

      - name: Fetch the canonical policy at that revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rylee-bee-labs/ci-harness
          ref: ${{ steps.pin.outputs.ref }}
          path: ${{ github.workspace }}/.ci-harness-src
          persist-credentials: false

      - name: Verify the checkout is the requested revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C "$HARNESS_SRC" rev-parse HEAD)"
          requested="$POLICY_REVISION"
          echo "requested: $requested"
          echo "actual   : $actual"
          if [[ "$actual" != "$requested" ]]; then
            echo "ERROR: fetched policy is not the pinned revision." >&2
            exit 1
          fi
          echo "policy revision verified"

      - name: Install conftest and jq
        shell: bash
        env:
          CONFTEST_VER: "0.69.0"
        run: |
          set -euo pipefail
          # conftest is a single Go binary; version pinned in pins/ACTIONS.md.
          # --rego-version v0 is required everywhere: conftest 0.46+ defaults
          # to Rego v1 and policy/claims.rego is v0 syntax.
          arch="x86_64"
          case "$(uname -m)" in
            aarch64|arm64) arch="arm64" ;;
          esac
          curl -sSL --retry 3 -o "$RUNNER_TEMP/conftest.tar.gz" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VER}/conftest_${CONFTEST_VER}_Linux_${arch}.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/conftest.tar.gz" conftest
          # Into the runner's own temp dir, on the PATH of the later steps: no sudo. On a self-hosted runner without
          # root (the estate's Bazzite runners) `sudo install ... /usr/local/bin` failed, the canary then "denied a
          # known-good input", and the check went red on every PR for a reason that had nothing to do with the PR
          # (agent-platform#227, 2026-10-08).
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/conftest" "$RUNNER_TEMP/bin/conftest"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/conftest" --version
          jq --version

      - name: Canary -- prove the policy fires before trusting it
        shell: bash
        run: |
          set -euo pipefail
          set +e
          echo '{"text":"30 tests pass"}' \
            | conftest test --rego-version v0 --policy "$HARNESS_SRC/policy/claims.rego" - \
            > "$RUNNER_TEMP/bad.out" 2>&1
          bad_rc=$?
          set -e
          cat "$RUNNER_TEMP/bad.out"
          if [[ $bad_rc -eq 0 ]]; then
            echo "ERROR: claims.rego did not deny a known-bad input (claim, no verify)." >&2
            echo "       A policy that fails to compile also exits nonzero, so read the" >&2
            echo "       output above before concluding the policy is merely strict." >&2
            exit 1
          fi
          if grep -qE 'rego_(parse|type|compile)_error' "$RUNNER_TEMP/bad.out"; then
            echo "ERROR: claims.rego does not compile — the exit above is a POLICY ERROR," >&2
            echo "       not a denial. Fix the policy before trusting any verdict from it." >&2
            exit 1
          fi
          set +e
          printf '%s\n' '{"text":"30 tests pass\n$ pytest tests/\n30 passed"}' \
            | conftest test --rego-version v0 --policy "$HARNESS_SRC/policy/claims.rego" - \
            > "$RUNNER_TEMP/good.out" 2>&1
          good_rc=$?
          set -e
          cat "$RUNNER_TEMP/good.out"
          if [[ $good_rc -ne 0 ]]; then
            echo "ERROR: claims.rego denied a known-good input (claim + command + output)" >&2
            exit 1
          fi
          echo "canary OK: policy fires on bad input, passes on good input"

      - name: Honest claims gate
        shell: bash
        run: |
          set -euo pipefail

          requested="$CHECK"
          if [[ "$requested" == "auto" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              requested="pr-body"
            else
              requested="commit-message"
            fi
          fi
          echo "checking: $requested (event=$GITHUB_EVENT_NAME)"

          case "$requested" in
            pr-body)
              if [[ ! -f "$GITHUB_EVENT_PATH" ]]; then
                echo "ERROR: GITHUB_EVENT_PATH missing; cannot read the PR body" >&2
                exit 1
              fi
              # Fail closed on an unreadable body rather than gating nothing.
              if ! jq -e '.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
                echo "ERROR: event payload has no .pull_request — cannot check the body" >&2
                exit 1
              fi
              jq -c '{text: (.pull_request.body // "")}' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/claim.json"
              ;;
            commit-message)
              if [[ ! -f "$GITHUB_EVENT_PATH" ]]; then
                echo "ERROR: GITHUB_EVENT_PATH missing; cannot read the commit message" >&2
                exit 1
              fi
              jq -c '{text: (.head_commit.message // "")}' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/claim.json"
              ;;
            *)
              echo "ERROR: unknown check mode '$requested' (want auto|pr-body|commit-message)" >&2
              exit 1
              ;;
          esac

          set +e
          conftest test --rego-version v0 --policy "$HARNESS_SRC/policy/claims.rego" \
            - < "$RUNNER_TEMP/claim.json"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "" >&2
            echo "A strong claim needs a command and its observed output." >&2
            echo "See docs/guides/honest-claims.md in this repo, or the PULL_REQUEST_TEMPLATE." >&2
          fi
          exit $rc

      - name: Drift -- repo mirror must match the canonical policy
        # Only meaningful for a repo that ships its own bash mirror. The
        # comparison runs the canonical test against the CONSUMER's tree, so
        # it is the consumer's copy that gets checked, not ci-harness's.
        if: ${{ inputs.mirror-path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$MIRROR_PATH" ]]; then
            echo "ERROR: mirror-path '$MIRROR_PATH' does not exist in this repo." >&2
            echo "       Either fix the path or clear the input — a mirror that is" >&2
            echo "       configured but absent is exactly the silent split this" >&2
            echo "       check exists to prevent." >&2
            exit 1
          fi
          echo "comparing $MIRROR_PATH against the pinned canonical policy"
          # The runner's system python3 has no pytest, and the drift test needs
          # it plus conftest and jq. Fail loudly rather than skipping: a check
          # that quietly does nothing is worse than no check.
          python3 -m pip install --quiet --disable-pip-version-check pytest
          CLAIMS_REPO_ROOT="$GITHUB_WORKSPACE" \
            python3 -m pytest "$HARNESS_SRC/tests/test_claim_policy_drift.py" -v

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true