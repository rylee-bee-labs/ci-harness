name: reusable-secret-scan

# ci-harness — reusable secret-scanning pipeline (workflow_call).
#
# Harness-owned mechanics: checkout (pinned), the gitleaks CLI (pinned version + sha256).
# Repo-owned semantics: a repo-local .gitleaks.toml for allowlisting known
# false positives (e.g. base64 SRI hashes) — never suppress at the harness
# level, per this estate's leak-canary convention (documented false
# positives, not blanket exceptions).
#
# Every action SHA below comes from pins/ACTIONS.md — the single pinning
# source. Consumers declare ~5 lines per job; see README.md.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      fetch-depth:
        description: >-
          History depth to scan on every event EXCEPT pull_request. 0 = full history
          (slower, thorough). On pull_request the workflow ignores this input: it fetches
          full history and scans only the commits the PR adds (base..head), so a finding
          already on the base branch cannot fail an unrelated PR. Callers keep a
          full-history scan on push to main and on a schedule (see AGENTS.md).
        type: number
        required: false
        default: 1

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR needs the base commit to compute base..head; everything else honours the input.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || inputs.fetch-depth }}

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-secret-scan:gitleaks
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      # The gitleaks CLI, not gitleaks-action: the action demands a paid licence key for any
      # organization-owned repo ("[rylee-bee-labs] is an organization. License key is required",
      # 2026-10-09, the first repo moved to the org). The CLI is MIT and needs no key. Pinned
      # version + sha256 from the release's own checksums file; a repo-local .gitleaks.toml is
      # read automatically, exactly as before. A finding still fails the job (exit 1).
      - name: gitleaks (CLI, pinned)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          # Pull requests: only the commits the PR adds. Every other event (push to main,
          # schedule, manual) scans everything fetched, unchanged. Fail closed: a PR whose
          # range cannot be resolved is an error, never a silent full or empty scan.
          scope=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git rev-parse --verify --quiet "${PR_BASE_SHA}^{commit}" >/dev/null \
              && git rev-parse --verify --quiet "${PR_HEAD_SHA}^{commit}" >/dev/null \
              || { echo "::error::secret-scan: cannot resolve PR range ${PR_BASE_SHA:-?}..${PR_HEAD_SHA:-?}"; exit 2; }
            scope=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
            echo "secret-scan: pull_request, scanning only ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            echo "secret-scan: ${EVENT_NAME}, scanning full fetched history"
          fi
          "$RUNNER_TEMP/gitleaks" git . "${scope[@]}" --redact --verbose --exit-code 1 --no-banner

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true
