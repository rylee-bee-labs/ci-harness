name: reusable-uat

# ci-harness — reusable real-browser UAT pipeline (workflow_call).
#
# What this is: a caller-supplied user-acceptance test command run against a
# real browser — real mouse, touch, and typing interaction plus axe-core
# accessibility assertions. Deliberately NOT `locator.click()` DOM-unit
# testing: the point is the interaction a user actually performs, so a
# template that stubs the app would defeat the purpose. The harness owns
# checkout (pinned), Node setup, lockfile-gated `npm ci`, and artifact
# upload; the repo owns the UAT command itself.
#
# Read-only posture: `read-only` (default true) exports UAT_READONLY=1.
# When read-only is true the harness aborts every non-GET HTTP request and
# records `would have sent: METHOD path` instead of performing it, blocks
# service workers, and drops WebSocket messages — non-GET HTTP methods fail
# closed. This blocks methods/channels, not server mutation: a GET endpoint
# with side effects still runs. The `uat-token` secret is passed only via the
# step `env:` block: it is never echoed to the log and never written to a file.
#
# Permissions: intentionally NOT declared at this workflow's top level.
# It uploads artifacts, so the caller must grant `actions: write` at the
# calling job (or workflow) level when `upload-artifacts: true`, exactly
# like `reusable-node`; with `upload-artifacts: false`, plain
# `contents: read` is enough. See README "Permissions".
#
# Every action SHA below comes from pins/ACTIONS.md.
#
# Consumer example:
#
#   jobs:
#     uat:
#       uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-uat.yml@main
#       with:
#         uat-command: "npm run uat"
#       secrets:
#         uat-token: ${{ secrets.UAT_TOKEN }}

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub-hosted runner label for the UAT job.
        type: string
        required: false
        default: "ubuntu-latest"
      node-version:
        description: Node.js version for setup-node.
        type: string
        required: false
        default: "22"
      uat-command:
        description: >-
          Repo-owned real-browser UAT command, e.g. "npm run uat".
        type: string
        required: true
      uat-url:
        description: >-
          Target URL for the run, passed to the command as $UAT_URL. Prefer this
          over inlining a URL in `uat-command`: consumers usually must not put
          deployment topology in a tracked workflow file, so the value normally
          comes from a repo secret or variable at the call site.
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory holding package.json, the lockfile, and the UAT config.
        type: string
        required: false
        default: "."
      uat-output-dir:
        description: UAT output directory to upload, relative to working-directory.
        type: string
        required: false
        default: "uat-out/"
      artifact-name:
        description: Artifact name for the uploaded UAT output.
        type: string
        required: false
        default: "uat-artifacts"
      upload-artifacts:
        description: Upload the UAT output as a workflow artifact.
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 30
      read-only:
        description: >-
          Enforce the read-only posture: abort every non-GET HTTP request and
          record "would have sent: METHOD path" instead (non-GET HTTP methods
          fail closed), block service workers, and drop WebSocket messages.
          Blocks methods/channels, not server mutation.
        type: boolean
        required: false
        default: true
    secrets:
      uat-token:
        description: Optional bearer token for a live-app read-only walk.
        required: false

# No top-level `permissions:` key on purpose — see header; the caller's
# grants flow down and may only be kept or downgraded by this workflow.

jobs:
  uat:
    name: agent-driven uat
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-uat:uat
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      # setup-node v7 THROWS "Some specified paths were not resolved, unable
      # to cache dependencies." when `cache:` is set and no lockfile
      # resolves — so caching is gated on lockfile presence, the same gate
      # as `npm ci`. An empty `cache:` value skips caching cleanly.
      - name: Detect npm lockfile
        id: lockfile
        working-directory: "."
        env:
          WORKDIR: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          present=false
          path=""
          cache=""
          if [ -f "$WORKDIR/package-lock.json" ]; then
            path="$WORKDIR/package-lock.json"
          elif [ -f "$WORKDIR/npm-shrinkwrap.json" ]; then
            path="$WORKDIR/npm-shrinkwrap.json"
          fi
          if [ -n "$path" ]; then
            present=true
            cache="npm"
          fi
          {
            echo "present=$present"
            echo "lockfile=${path#./}"
            echo "cache=$cache"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.lockfile.outputs.cache }}
          cache-dependency-path: ${{ steps.lockfile.outputs.lockfile }}
      - name: Install dependencies from lockfile
        if: ${{ steps.lockfile.outputs.present == 'true' }}
        run: npm ci
      - name: Notice when no lockfile
        if: ${{ steps.lockfile.outputs.present != 'true' }}
        run: echo "dependencies were not installed because no npm lockfile was found (honest reporting over fake green)"
      # When `read-only` is true the harness aborts every non-GET HTTP
      # request and records `would have sent: METHOD path` instead of
      # performing it, blocks service workers, and drops WebSocket
      # messages; non-GET HTTP methods fail closed. It does not prove the
      # server was protected from mutation (GET side effects still run).
      # The token travels only through env — never echoed, never written to
      # a file.
      - name: Run UAT
        run: ${{ inputs.uat-command }}
        env:
          UAT_READONLY: ${{ inputs.read-only && '1' || '0' }}
          UAT_TOKEN: ${{ secrets.uat-token }}
          UAT_URL: ${{ inputs.uat-url }}
      - name: Upload UAT output
        if: ${{ always() && inputs.upload-artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.uat-output-dir }}
          retention-days: 14

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true
