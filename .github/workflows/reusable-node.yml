name: reusable-node

# ci-harness — reusable Node pipeline (workflow_call).
#
# Harness-owned mechanics: checkout (pinned), setup-node, `npm ci` from the
# committed lockfile, build/lint/test execution, upload of the dist bundle.
# Repo-owned semantics: the actual commands. An empty command input skips its
# step, so a repo with no lint step declares no lint — no fake green.
#
# setup-python exists for the common polyglot e2e shape (Playwright driving a
# uv-served Python app); it bootstraps Python + uv and syncs the root
# lockfile before npm work starts.
#
# Permissions: intentionally NOT declared at this workflow's top level.
# A called reusable workflow may only keep or downgrade the caller's
# GITHUB_TOKEN permissions (elevating fails the run at validation), so the
# caller decides what this job may do: grant `actions: write` at the calling
# job (or workflow) level when upload-dist: true; plain `contents: read` is
# enough when upload-dist: false. See README "Permissions".
#
# Every action SHA below comes from pins/ACTIONS.md.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for every job (default GitHub-hosted ubuntu-latest). Private repos pass
          vars.CI_RUNNER_LIGHT, then vars.CI_RUNNER, then ubuntu-latest, to use a self-hosted
          runner (2026-10-05: private-repo Actions minutes are a hard monthly budget).
        type: string
        required: false
        default: ubuntu-latest
      node-version:
        description: Node.js version for setup-node.
        type: string
        required: false
        default: "22"
      working-directory:
        description: Directory holding package.json and the lockfile.
        type: string
        required: false
        default: "."
      npm-ci-args:
        description: Extra arguments for `npm ci`.
        type: string
        required: false
        default: "--no-audit --no-fund"
      build-command:
        description: Build command, e.g. "npm run build". Skipped when empty.
        type: string
        required: false
        default: ""
      lint-command:
        description: Lint command, e.g. "npm run lint". Skipped when empty.
        type: string
        required: false
        default: ""
      test-command:
        description: >-
          Test command, e.g. "npx playwright install --with-deps chromium
          && npx playwright test". Skipped when empty.
        type: string
        required: false
        default: ""
      setup-python:
        description: >-
          Also install Python + uv and run `uv sync --frozen` at the repo
          root before npm steps (polyglot e2e support).
        type: boolean
        required: false
        default: false
      python-version:
        description: CPython version used when setup-python is true.
        type: string
        required: false
        default: "3.12"
      uv-version:
        description: Exact uv version bootstrapped when setup-python is true.
        type: string
        required: false
        default: "0.11.28"
      sync-args:
        description: Extra arguments for `uv sync --frozen` (root project).
        type: string
        required: false
        default: ""
      upload-dist:
        description: Upload the build output as a workflow artifact.
        type: boolean
        required: false
        default: true
      artifact-name:
        description: Artifact name for the uploaded build output.
        type: string
        required: false
        default: "dist"
      dist-path:
        description: Build output directory, relative to working-directory.
        type: string
        required: false
        default: "dist"

# No top-level `permissions:` key on purpose — see header; the caller's
# grants flow down and may only be kept or downgraded by this workflow.

jobs:
  build:
    name: node build
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Preflight: fail in one plain line, before any real work, when the runner's scratch or
      # workspace is not writable by this job's uid (self-hosted leftovers from a root-owned
      # container job are the usual cause). Then drop this harness's own scratch files from a
      # previous job on the same runner; RUNNER_TEMP's runner-owned entries are never touched.
      - name: Preflight (workspace and scratch writable)
        shell: bash
        # Runs before checkout, so the job's default working-directory may not exist yet.
        working-directory: ${{ runner.temp }}
        run: |
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ ! -d "$d" ] || [ ! -w "$d" ] || ! probe=$(mktemp "$d/.preflight.XXXXXX" 2>/dev/null); then
              echo "::error::preflight: $d is not writable by uid $(id -u) ($(id -un)); owner is $(stat -c '%U:%G' "$d" 2>/dev/null || echo missing)"
              exit 1
            fi
            rm -f "$probe"
          done
          cd "$RUNNER_TEMP"
          rm -rf otel-span.sh otel-ctx.env pytest-junit.xml gitleaks gitleaks_*.tar.gz \
            conftest conftest.tar.gz bin bad.out good.out claim.json play-nice-contracts \
            freshness.json project-home-estate-task project-home-request.json project-home-response.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

# Telemetry is observation, never authority: this step cannot fail the job
      # (continue-on-error) and the helper exits 0 even when the Collector is
      # unreachable. The endpoint arrives through the standard OTEL environment
      # variables, read from repository variables — a new `workflow_call` input
      # on every template would cost a self-smoke job each for one string, and
      # would be estate-specific discovery the contract explicitly rules out.
      # An unset variable is simply empty, which means off.
      - name: OpenTelemetry context
        continue-on-error: true
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ESTATE_HOST_CLASS: ${{ vars.ESTATE_HOST_CLASS }}
          OTELSPAN_HELPER_URL: https://raw.githubusercontent.com/rylee-bee-labs/ci-harness/main/scripts/otel-span.sh
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_JOB_KEY: reusable-node:build
          OTELSPAN_PIPELINE_NAME: ${{ github.workflow }}
          OTELSPAN_RUN_ID: ${{ github.run_id }}
          OTELSPAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          OTELSPAN_REPOSITORY: ${{ github.repository }}
          OTELSPAN_REF_HEAD: ${{ github.head_ref || github.ref_name }}
          OTELSPAN_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OTELSPAN_CHANGE_ID: ${{ github.event.pull_request.number }}
          OTELSPAN_RUNNER_LABEL: ${{ inputs.runs-on }}
        run: |
          set -u
          # The helper lives in this repo, but a reusable workflow's `github`
          # context is the *caller's* repository, so checkout above never brings
          # it along. Prefer the tree when we are the caller (self-smoke), and
          # fetch it from ci-harness otherwise.
          if [ -s "$GITHUB_WORKSPACE/scripts/otel-span.sh" ]; then
            cp "$GITHUB_WORKSPACE/scripts/otel-span.sh" "$OTELSPAN_HELPER"
          elif ! curl -fsSL --max-time 15 "$OTELSPAN_HELPER_URL" -o "$OTELSPAN_HELPER"; then
            echo "::notice::otel: span helper unavailable; telemetry stays off for this job"
            rm -f "$OTELSPAN_HELPER"
          fi
          if [ -s "$OTELSPAN_HELPER" ]; then
            bash "$OTELSPAN_HELPER" context --env-file "$OTELSPAN_ENV_FILE" || true
          fi
      - name: Set up Python (polyglot e2e)
        if: ${{ inputs.setup-python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Bootstrap uv and sync root Python dependencies
        if: ${{ inputs.setup-python }}
        working-directory: "."
        run: |
          pip install uv==${{ inputs.uv-version }}
          uv sync --frozen ${{ inputs.sync-args }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies from lockfile
        run: npm ci ${{ inputs.npm-ci-args }}
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}
      - name: Test
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
      - name: Upload build output
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.dist-path }}

      # `if: always()` because the job may have failed, and the span has to carry
      # that verdict — that is the whole reason it exists. A job that never ran
      # (a gated `if: inputs.enable-*` job) never reaches this step either, which
      # is equally honest.
      - name: OpenTelemetry spans
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          OTELSPAN_HELPER: ${{ runner.temp }}/otel-span.sh
          OTELSPAN_ENV_FILE: ${{ runner.temp }}/otel-ctx.env
          OTELSPAN_RESULT: ${{ job.status }}
        run: |
          set -u
          [ -s "$OTELSPAN_HELPER" ] || exit 0
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role pipeline --result "$OTELSPAN_RESULT" || true
          bash "$OTELSPAN_HELPER" ci-emit --env-file "$OTELSPAN_ENV_FILE" --role job --result "$OTELSPAN_RESULT" || true
