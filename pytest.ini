[pytest]
# ci-harness's own gate is tests/ and nothing else. fixtures/ holds self-smoke
# fixture *repos*: each has its own pytest.ini, its own imports and its own
# lockfile, and each is exercised by the workflow that owns it (self-smoke.yml
# runs the pytest ones from a copy in RUNNER_TEMP). A repo-wide run must never
# walk into them — fixtures/affected-demo's tests import sibling modules from
# their own rootdir and fail collection under the repo's rootdir.
# Contract: tests/test_workflow_contracts.py::RepoCollectionTest.
testpaths = tests
norecursedirs = fixtures .git .venv build dist *.egg-info